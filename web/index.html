<script>
/* aspetto: automatico / chiaro / scuro / luce calda (+ luce calda la sera) e dimensione del testo */
window.lookResolve = function (p) {
  p = p || {};
  var t = p.theme || 'auto', min = function (s) { var a = String(s || '').split(':'); return (+a[0] || 0) * 60 + (+a[1] || 0); };
  var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches), warm = t === 'warm', night = false;
  if (p.night) { var n = new Date(), m = n.getHours() * 60 + n.getMinutes(), f = min(p.from || '21:00'), to = min(p.to || '07:00');
    night = f > to ? (m >= f || m < to) : (m >= f && m < to); }
  return {dark: dark, warm: warm || night, size: p.size || 'm'};
};
window.lookApply = function (p) {
  var r = document.documentElement, x = window.lookResolve(p);
  r.setAttribute('data-theme', x.dark ? 'dark' : 'light');
  if (x.warm) r.setAttribute('data-warm', '1'); else r.removeAttribute('data-warm');
  if (x.size !== 'm') r.setAttribute('data-size', x.size); else r.removeAttribute('data-size');
  var bg = x.dark ? (x.warm ? '#17130e' : '#000000') : (x.warm ? '#f3ead8' : '#fbfbfa');
  document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = bg; m.removeAttribute('media'); });
};
(function () {
  var p = {};
  try { p = JSON.parse(localStorage.getItem('tacuin-look') || '{}') || {}; } catch (e) {}
  if (!p.theme) { var old = null; try { old = localStorage.getItem('tracker-theme'); } catch (e) {} if (old === 'light' || old === 'dark') p.theme = old; }
  window.lookApply(p);
})();
</script>

:root{--sf-text:"Inter",sans-serif;--sf-display:"Inter",sans-serif}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
input,select,button,textarea{font-family:inherit}
.title,.card .val,.brand{font-family:var(--sf-display);letter-spacing:-.022em}
.card .val{letter-spacing:-.015em}
body{margin:0;font:14px/1.5 var(--sf-text);letter-spacing:-.006em;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:5px;padding:4px 8px}
button:hover:not(:disabled){background:var(--hover)}
button:disabled{opacity:.35;cursor:default}
aside{width:240px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 8px;flex-shrink:0}
.brand{font-weight:600;padding:2px 8px 6px}
.nav{flex:1;overflow:auto}
.nav-sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:14px 8px 4px;display:flex;justify-content:space-between;align-items:center}
.nav-sec button{padding:0 6px;font-size:15px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer}
.nav-item:hover,.nav-item.active{background:var(--hover)}
.nav-item.active{font-weight:500}
.nav-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{margin-left:auto;color:var(--muted);font-size:12px}
.side-foot{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:1px}
.side-foot button{text-align:left;color:var(--muted)}
.saved{font-size:11px;color:var(--muted);padding:6px 8px 0;min-height:20px}
main{flex:1;overflow:auto;padding:44px 56px}
.head{display:flex;align-items:center;gap:6px;margin-bottom:18px}
.icon{font-size:30px;padding:0 6px;line-height:1.3}
.title{font-size:30px;font-weight:700;border:0;background:transparent;color:inherit;outline:none;flex:1;min-width:0;font-family:inherit;margin:0}
.title::placeholder{color:var(--muted)}
.more{color:var(--muted);font-size:18px}
.sub{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 10px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.range{font-weight:500;min-width:120px;text-align:center}
.field,#q{border:1px solid var(--line);background:var(--card);color:inherit;padding:6px 9px;border-radius:6px;font:inherit;outline:none}
.field:focus,#q:focus{border-color:var(--accent)}
#q{width:220px;max-width:50vw}
.primary{background:var(--accent);color:var(--on-accent);font-weight:500;padding:6px 12px}
.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border-radius:0}
.seg button.on{background:var(--hover);font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .lbl{font-size:12px;color:var(--muted)}
.card .val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--danger)}
.progress{height:6px;background:var(--hover);border-radius:3px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:var(--accent);transition:width .2s}
.bars{display:flex;flex-direction:column;gap:9px}
.bar .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:3px}
.bar .row span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:8px;background:var(--hover);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px}
.addform{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:28px;align-items:start}
.grid2 .sub{margin-top:0}
.hint{color:var(--muted);font-size:13.5px;line-height:1.5;margin-top:10px}
.tablewrap{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;min-width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:left;vertical-align:middle}
th:last-child,td:last-child{border-right:0}
th{font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
.dt th{padding:6px 8px}
th.num{text-align:right}
th .colbtn{width:100%;text-align:left;padding:6px 8px;border-radius:0;min-width:150px}
th .ti{display:inline-block;width:18px;opacity:.7;font-size:12px}
th.addcol,td.del{width:36px}
th.addcol button{width:100%;border-radius:0;padding:6px 0}
.cell{width:100%;border:0;background:transparent;color:inherit;font:inherit;padding:7px 8px;outline:none;min-width:60px}
.cell.num{text-align:right;font-variant-numeric:tabular-nums}
.cell.wide{min-width:170px}
.cell:focus{background:var(--card);box-shadow:inset 0 0 0 2px var(--accent)}
td.calc{padding:7px 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.cb{text-align:center}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:9px;cursor:pointer;vertical-align:middle}
td select{appearance:none;-webkit-appearance:none;border:0;color:inherit;font:inherit;font-size:13px;padding:2px 10px;margin:5px 6px;border-radius:4px;cursor:pointer;outline:none;background:transparent;max-width:calc(100% - 12px)}
td select:focus{box-shadow:0 0 0 2px var(--accent)}
td select.empty{color:var(--muted)}
td select option{background:var(--card);color:var(--text)}
td.del button{opacity:0;color:var(--muted);width:100%;border-radius:0}
tr:hover td.del button{opacity:1}
td.del button:hover{color:var(--danger)}
tbody tr:hover{background:color-mix(in srgb,var(--hover) 45%,transparent)}
tfoot td{border-bottom:0;padding:6px 8px;color:var(--muted);font-size:12px}
tfoot b{color:var(--text);font-weight:500}
.newrow{color:var(--muted);width:100%;text-align:left;padding:7px 8px;border-radius:0}
.count{color:var(--muted);font-size:12px;margin-top:8px}
.empty{color:var(--muted);text-align:center;margin-top:20vh}
/* abitudini */
.hab th.dh{font-size:11px;text-align:center;min-width:34px;padding:4px 2px;line-height:1.25}
.hab.compact th.dh{min-width:26px}
.hab th.today{color:var(--accent);font-weight:700}
.hab td.hc{text-align:center;padding:3px 2px}
.hcell{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);padding:0;color:#fff;font-size:13px;line-height:1}
.hab.compact .hcell{width:20px;height:20px;border-radius:5px;font-size:10px}
.hcell.on{border-color:transparent}
.hcell:disabled{opacity:.25}
.hname{min-width:170px;width:100%;text-align:left;padding:7px 8px;border-radius:0}
/* menu */
.menu{position:fixed;z-index:10;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:4px;min-width:200px;display:flex;flex-direction:column}
.menu button{text-align:left;display:flex;gap:6px;padding:5px 8px;white-space:nowrap}
.menu .ck{width:14px;color:var(--accent)}
.menu .danger{color:var(--danger)}
.msep{border-top:1px solid var(--line);margin:4px 0;padding:5px 8px 1px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.msep:empty{padding:0}
.grid2>*{min-width:0}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mbar,.scrim{display:none}
@media (max-width:760px){
  body{display:block;height:auto;min-height:100vh;overflow-x:hidden;overflow-y:auto}
  body.nav-open{overflow:hidden}
  /* barra in alto */
  .mbar{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:30;
    height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 130px 0 calc(8px + env(safe-area-inset-left));
    background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);

/* ===================== sistema grafico v2: icone, misure, layout per telefono / tablet / PC ===================== */
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

.tile{width:40px;height:40px;border-radius:12px;background:var(--tile);display:grid;place-items:center;flex:none;color:var(--text)}

function streak(h) {
  let d = new Date(); if (!h.done[iso(d)]) d = addDays(d, -1);
  let s = 0; while (h.done[iso(d)]) { s++; d = addDays(d, -1); }
  return s;
}
function pct30(h) {
  const limit = iso(addDays(new Date(), -29));
  const start = h.created && h.created > limit ? h.created : limit;
  let tot = 0, c = 0;
  for (let i = 0; i < 30; i++) { const k = iso(addDays(new Date(), -i)); if (k < start) break; tot++; if (h.done[k]) c++; }
  return tot ? Math.round(c / tot * 100) : 0;
}

/* ---------- SPESE CONDIVISE ---------- */
const ME = 'me';
const SH = () => state.expenses.shared;
const cents = n => Math.round(n * 100) / 100;
const pName = id => id === ME ? (SH().myName || 'Tu') : (SH().people.find(p => p.id === id)?.name || 'Persona rimossa');
const activePeople = () => SH().people.filter(p => !p.archived);
function shareOf(x, pid) {
  if (!x.split.includes(pid)) return 0;
  const w = x.weights;
  if (!w) return num(x.amount) / x.split.length;
  const tot = x.split.reduce((a, i) => a + (+w[i] || 0), 0);
  return tot ? num(x.amount) * (+w[pid] || 0) / tot : 0;
}
/* Quote: "1/3", "40%", "2" (parti) oppure importi in €. Chi resta vuoto prende il resto, in parti uguali. */
function parseQuota(str, eur) {
  const t = String(str ?? '').trim().replace(/\s+/g, '').replace(',', '.');
  if (!t) return null;
  let m = t.match(/^(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if (m && !eur && +m[2]) return {k: 'frac', v: +m[1] / +m[2]};
  m = t.match(/^(\d+(?:\.\d+)?)%$/);
  if (m && !eur) return {k: 'frac', v: +m[1] / 100};
  m = t.match(/^(\d+(?:\.\d+)?)(€|eur|euro)?$/i);
  if (m) return {k: eur || m[2] ? 'eur' : 'part', v: +m[1]};
  return {k: 'bad'};
}
function computeWeights(amount, ids, raw, mode) {
  if (mode === 'equal') return {weights: null};
  const q = {}; ids.forEach(i => q[i] = parseQuota(raw[i], mode === 'eur'));
  const given = ids.filter(i => q[i]), free = ids.filter(i => !q[i]);
  if (given.some(i => q[i].k === 'bad')) return {error: 'Quota non valida: usa 1/3, 40% o un numero.'};
  const kinds = new Set(given.map(i => q[i].k));
  if (kinds.size > 1) return {error: 'Usa lo stesso tipo di quota per tutti (frazioni/percentuali oppure parti).'};
  const kind = [...kinds][0], w = {};
  given.forEach(i => w[i] = q[i].v);
  if (!given.length) return {weights: null};
  if (kind === 'part') { free.forEach(i => w[i] = 1); return {weights: w}; }
  const total = kind === 'eur' ? amount : 1, used = given.reduce((a, i) => a + w[i], 0), rest = total - used;
  if (rest < -0.005 * (kind === 'eur' ? 1 : 0.01)) return {error: kind === 'eur' ? `Gli importi superano il totale di ${EUR(-rest)}.` : 'Le quote superano il 100%.'};
  if (free.length) free.forEach(i => w[i] = Math.max(0, rest) / free.length);
  else if (Math.abs(rest) > (kind === 'eur' ? 0.01 : 0.001)) return {error: kind === 'eur' ? `Mancano ${EUR(rest)} per arrivare al totale.` : `Le quote arrivano solo al ${Math.round(used * 100)}%.`};
  return {weights: w};
}
const splitLabel = x => x.weights
  ? x.split.map(i => `${pName(i)} ${Math.round(shareOf(x, i) / (num(x.amount) || 1) * 100)}%`).join(', ')
  : x.split.map(pName).join(', ');
function myEffect(x) { // quanto il saldo si sposta a mio favore (+) o contro (-)
  return x.payer === ME ? num(x.amount) - shareOf(x, ME) : -shareOf(x, ME);
}
function balances() { // persona → quanto ti deve (+) o quanto le devi (-)
  const S = SH(), b = {};
  S.people.forEach(p => b[p.id] = 0);
  S.items.forEach(x => x.split.forEach(pid => {
    if (pid === x.payer) return;
    const q = shareOf(x, pid);
    if (x.payer === ME) b[pid] = (b[pid] || 0) + q;
    else if (pid === ME) b[x.payer] = (b[x.payer] || 0) - q;
  }));
  S.settlements.forEach(z => {
    if (z.to === ME) b[z.from] = (b[z.from] || 0) - num(z.amount);
    if (z.from === ME) b[z.to] = (b[z.to] || 0) + num(z.amount);
  });
  Object.keys(b).forEach(k => b[k] = cents(b[k]));
  return b;
}
function balText(name, v) {
  if (Math.abs(v) < 0.005) return `<span class="muted">Siete pari</span>`;
  return v > 0 ? `<span class="pos">ti deve ${EUR(v)}</span>` : `<span class="neg">gli devi ${EUR(-v)}</span>`;
}

function visibleRows(t) {
  let rows = t.rows;
  if (query) {
    const q = query.toLowerCase();
    rows = rows.filter(r => t.columns.some(c => String(r.cells[c.id] ?? '').toLowerCase().includes(q)));
  }
  const c = sort.col && t.columns.find(x => x.id === sort.col);
  if (c) rows = [...rows].sort((a, b) => {
    let va = a.cells[c.id], vb = b.cells[c.id];
    if (c.type === 'checkbox') return ((va ? 1 : 0) - (vb ? 1 : 0)) * sort.dir;
    const ea = isEmpty(va), eb = isEmpty(vb);
    if (ea || eb) return ea - eb;
    let r;
    if (c.type === 'number') r = parseFloat(va) - parseFloat(vb);
    else if (c.type === 'select') r = (c.options || []).indexOf(va) - (c.options || []).indexOf(vb);
    else r = String(va).localeCompare(String(vb), 'it', {numeric: true, sensitivity: 'base'});
    return r * sort.dir;
  });
  return rows;
}

function cellHtml(c, v, first) {
  const d = `data-c="${c.id}" aria-label="${esc(c.name)}"`, l = first ? 'class="w"' : `data-l="${esc(c.name)}"`;
  switch (c.type) {
    case 'number': return `<td ${l}><input class="cell" type="number" step="any" inputmode="decimal" ${d} value="${esc(v)}"></td>`;
    case 'date': return `<td ${l}><input class="cell" type="date" ${d} value="${esc(v)}"></td>`;
    case 'checkbox': return `<td class="cb ${first ? 'w' : ''}" ${first ? '' : `data-l="${esc(c.name)}"`}><input type="checkbox" ${d} ${v ? 'checked' : ''}></td>`;
    case 'select': {
      const opts = (c.options || []).map(o => `<option ${o === v ? 'selected' : ''} value="${esc(o)}">${esc(o)}</option>`).join('');
      return `<td ${l}><select ${d}><option value="">—</option>${opts}</select></td>`;
    }
    default: return `<td ${l}><input class="cell" ${d} value="${esc(v)}"></td>`;
  }
}
function paintSelect(el, col) {

  el.style.background = i < 0 ? 'transparent' : col.colors?.[el.value] ? `color-mix(in srgb, ${col.colors[el.value]} 22%, transparent)` : `hsl(${hue(i)} 65% 50% / .2)`;

    onSave: d => {

        if (!isNew && col.type === 'select') t.rows.forEach(r => { const v = r.cells[col.id]; if (ren[v]) r.cells[col.id] = ren[v]; });
        if (col.type !== 'select') changeType(col, 'select', true);

function colMenu(btn, c) {

function moveCol(i, d) { const cols = cur().columns; [cols[i], cols[i + d]] = [cols[i + d], cols[i]]; save(); renderMain(); }
function changeType(c, k, quiet) {
  if (c.type === k) return;
  const t = cur();
  t.rows.forEach(r => {
    let v = r.cells[c.id];
    if (k === 'checkbox') v = !isEmpty(v) && v !== false && v !== 'No' && v !== '0';
    else if (c.type === 'checkbox') v = v ? 'Sì' : '';
    else if (k === 'number') { const n = parseFloat(String(v ?? '').replace(',', '.')); v = isNaN(n) ? '' : String(n); }
    else if (k === 'date') v = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
    else v = isEmpty(v) ? '' : String(v);
    r.cells[c.id] = v;
  });
  if (k === 'select') {
    const vals = t.rows.map(r => r.cells[c.id]).filter(v => !isEmpty(v));

/* ---------- backup e utilità ---------- */
function download(text, name, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#exp').onclick = () => download(JSON.stringify(state, null, 2), `tracker-backup-${today()}.json`, 'application/json');
$('#imp').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.trackers)) throw 0;
      if (!await confirmSheet({title: 'Ripristinare il backup?', text: 'Tutti i dati attuali vengono sostituiti con quelli del file. Se vuoi tenerli, prima esporta un backup.', ok: 'Sostituisci i dati'})) return;
      state = migrate(d); state.active = cur()?.id ?? null;
      dirty = true; writeNow(); render();
    } catch (err) { toast('File non valido: serve un backup esportato da Tacuìn.'); }
  };
  rd.readAsText(f); e.target.value = '';
};

function openMenu(anchor, items) {

    if (it.sep) { const s = document.createElement('div'); s.className = 'msep'; if (it.label) s.textContent = it.label; m.appendChild(s); return; }
    const b = document.createElement('button');

    b.onclick = () => { closeMenu(); it.act(); };

  document.body.appendChild(m); menuEl = m;
  const r = anchor.getBoundingClientRect();
  let top = r.bottom + 4; if (top + m.offsetHeight > innerHeight - 8) top = Math.max(8, r.top - m.offsetHeight - 4);

  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px';
}

(function swipe() { // swipe dal bordo sinistro per aprire, verso sinistra per chiudere
  let x0 = null, y0 = 0, dx = 0, mode = null;
  const side = $('#side'), w = () => side.offsetWidth;
  document.addEventListener('touchstart', e => {
    if (!isMobile() || e.touches.length !== 1) return;
    const t = e.touches[0], open = document.body.classList.contains('nav-open');
    if (!open && t.clientX < 24) mode = 'open';
    else if (open) mode = 'close';
    else return;
    x0 = t.clientX; y0 = t.clientY; dx = 0;
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    if (x0 == null) return;
    const t = e.touches[0]; dx = t.clientX - x0;
    if (Math.abs(t.clientY - y0) > Math.abs(dx) && Math.abs(dx) < 12) { x0 = null; document.body.classList.remove('dragging'); side.style.transform = ''; return; }
    document.body.classList.add('dragging');
    const off = mode === 'open' ? Math.min(0, -w() + Math.max(0, dx)) : Math.min(0, dx);
    side.style.transform = `translateX(${off}px)`;
  }, {passive: true});
  document.addEventListener('touchend', () => {
    if (x0 == null) return;
    document.body.classList.remove('dragging'); side.style.transform = '';
    if (mode === 'open' && dx > 60) openNav();
    if (mode === 'close' && dx < -60) closeNav();
    x0 = null; mode = null;
  });
})();
matchMedia('(max-width:760px)').addEventListener?.('change', e => { if (!e.matches) closeNav(); });

      || `<p class="hint">Nessuna icona per «${esc(q)}».</p>`;
  };

/* ---------- NOME UTENTE @ ---------- */
function handleCheck(inp, st) {
  let t = null, seq = 0;
  inp.addEventListener('input', () => {
    const v = inp.value.replace(/^@+/, '').toLowerCase().replace(/[^a-z0-9._]/g, '');
    if (v !== inp.value) inp.value = v;
    clearTimeout(t); st.textContent = ''; st.className = 'hdl-st';
    if (v.length < 3) return;
    const my = ++seq;
    t = setTimeout(async () => {
      try {
        const j = await api('api/handle/check?h=' + encodeURIComponent(v));
        if (my !== seq) return;
        st.textContent = j.ok ? 'libero' : (j.error ? 'non valido' : 'già preso'); st.className = 'hdl-st ' + (j.ok ? 'ok' : 'no');
        st.title = j.error || '';
      } catch (e) { if (my === seq) { st.textContent = ''; } }
    }, 350);
  });
}

  const drawType = () => {
    f.querySelectorAll('[data-t]').forEach(b => { const on = b.dataset.t === type; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    $$('.xs-share').hidden = type !== 'out';
  };
  const drawPeople = () => {
    $$('.xs-ppl').innerHTML = ppl.map((p, i) => `<button type="button" class="xs-p ${p.on ? 'on' : ''}" data-p="${i}" aria-pressed="${p.on}" ${p.me ? 'disabled' : ''}>
      <span class="av">${esc(p.name.slice(0, 1).toUpperCase())}</span>${esc(p.me ? 'Tu' : p.name)}${p.handle ? `<small>@${esc(p.handle)}</small>` : p.fresh ? '<small>nuova</small>' : ''}</button>`).join('');
    const cur = f.payer.value || ME;
    f.payer.innerHTML = ppl.filter(p => p.on).map(p => `<option value="${esc(p.id)}" ${p.id === cur ? 'selected' : ''}>${esc(p.me ? 'Io' : p.name)}</option>`).join('');
  };
  const drawQuotas = () => {
    const box = $$('.xs-q'); box.hidden = mode === 'equal'; if (mode === 'equal') return;
    box.innerHTML = ids().map(i => `<label class="xs-qr"><span>${esc(i === ME ? 'Tu' : nm(i))}</span><input data-q="${esc(i)}" value="${esc(raw[i] || '')}" inputmode="decimal" placeholder="${mode === 'eur' ? 'es. 30' : 'es. 1/3 o 40%'}"><small data-qv="${esc(i)}"></small></label>`).join('')
      + `<small class="muted">Chi lasci vuoto si divide il resto.</small>`;
  };
  const calc = () => {
    const a = cents(Math.abs(num(f.amt.value))), sel = ids(), r = computeWeights(a, sel, raw, mode);
    return {a, sel, r, x: {amount: a, split: sel, weights: r.weights, payer: f.payer.value || ME}};
  };
  const drawSum = () => {
    if (!share || type !== 'out') return;
    const {a, sel, r, x} = calc();
    f.querySelectorAll('[data-qv]').forEach(el => { el.textContent = a && !r.error ? EUR(shareOf(x, el.dataset.qv)) : ''; });
    let html;
    if (r.error) html = `<span class="neg">${esc(r.error)}</span>`;
    else if (sel.length < 2) html = '<span class="muted">Scegli almeno un\'altra persona.</span>';
    else if (!a) html = '<span class="muted">Scrivi l\'importo per vedere le quote.</span>';
    else {
      const mine = shareOf(x, ME);
      const owe = x.payer === ME ? sel.filter(i => i !== ME).map(i => `${esc(nm(i).split(' ')[0])} ti deve <b>${EUR(shareOf(x, i))}</b>`)
        : [`Devi <b>${EUR(mine)}</b> a ${esc(nm(x.payer).split(' ')[0])}`];
      html = `<div>La tua quota: <b>${EUR(mine)}</b>, va anche nelle tue spese.</div><div class="muted">${owe.join(' · ')}</div>`;
    }
    $$('.xs-sum').innerHTML = html;
  };
  const drawShare = () => { $$('.xs-sbody').hidden = !share; f.share.checked = share; drawPeople(); drawQuotas(); drawSum(); };
  const addPerson = (name, handle) => {
    name = String(name || '').trim().slice(0, 40); if (!name) return;
    const ex = ppl.find(p => (handle && p.handle === handle) || (!handle && !p.me && p.name.toLowerCase() === name.toLowerCase()));
    if (ex) ex.on = true;
    else {
      const old = handle && S.people.find(p => p.handle === handle) || (!handle && S.people.find(p => p.name.toLowerCase() === name.toLowerCase()));
      ppl.push(old ? {id: old.id, name: old.name, handle: old.handle || '', on: true, revive: !!old.archived} : {id: 'new-' + uid(), name, handle: handle || '', on: true, fresh: true});
    }
    f.who.value = ''; hideFound(); drawPeople(); drawQuotas(); drawSum();
  };
  const hideFound = () => { const b = $$('.xs-found'); b.hidden = true; b.innerHTML = ''; found = []; };
  const search = () => {
    const v = f.who.value.trim(); clearTimeout(qTimer);
    if (!(REMOTE && USER) || !v.startsWith('@') || v.length < 4) { hideFound(); return; }
    const seq = ++qSeq;
    qTimer = setTimeout(async () => {
      try {
        const j = await api('api/users/search?q=' + encodeURIComponent(v.slice(1)));
        if (seq !== qSeq) return;
        found = j.users || [];
        const b = $$('.xs-found');
        b.innerHTML = found.length ? found.map((u, i) => `<button type="button" role="option" data-fu="${i}"><span class="av">${esc(u.name.slice(0, 1).toUpperCase())}</span><span><b>${esc(u.name)}</b><small>@${esc(u.handle)} · su Tacuìn</small></span></button>`).join('')
          : `<div class="muted" style="padding:10px 12px;font-size:14px">Nessun utente con questo nome utente.</div>`;
        b.hidden = false;
      } catch (e) { if (e.status === 429) toast(e.message); }
    }, 250);
  };
  f.addEventListener('click', e => {
    const t = e.target.closest('[data-t]'); if (t) { type = t.dataset.t; drawType(); return; }
    const pb = e.target.closest('[data-p]'); if (pb) { const p = ppl[+pb.dataset.p]; if (!p.me) { p.on = !p.on; drawPeople(); drawQuotas(); drawSum(); } return; }
    if (e.target.closest('[data-addp]')) { const v = f.who.value.trim(); if (v.startsWith('@')) { if (found[0]) addPerson(found[0].name, found[0].handle); else search(); } else addPerson(v); return; }
    const fu = e.target.closest('[data-fu]'); if (fu) { const u = found[+fu.dataset.fu]; addPerson(u.name, u.handle); return; }
    if (e.target.closest('[data-x]')) closeSheet();
  });
  f.who.addEventListener('input', search);
  f.who.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); f.querySelector('[data-addp]').click(); } });
  f.share.onchange = () => { share = f.share.checked; drawShare(); };
  f.mode.onchange = () => { mode = f.mode.value; Object.keys(raw).forEach(k => delete raw[k]); drawQuotas(); drawSum(); };
  f.payer.onchange = drawSum;
  f.amt.addEventListener('input', drawSum);
  $$('.xs-q').addEventListener('input', e => { const i = e.target.dataset.q; if (i) { raw[i] = e.target.value; drawSum(); } });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const err = m => { $$('.xs-err').textContent = m; };
    const {a, sel, r, x} = calc();
    if (!a) { err('Scrivi l\'importo.'); f.amt.focus(); return; }
    const date = f.date.value || today(), desc = f.desc.value.trim(), cat = f.cat.value;
    ui.lastCat = cat; ui.lastType = type;
    if (!share || type !== 'out') {
      E.items.push({id: uid(), date, desc, category: cat, type, amount: a});
      ui.expMonth = date.slice(0, 7); save(); closeSheet(); renderMain();
      toast(`Registrata: ${desc || cat} ${EUR(a)}`); return;
    }
    if (sel.length < 2) { err('Scegli almeno un\'altra persona con cui dividerla.'); return; }
    if (r.error) { err(r.error); return; }
    if (x.payer !== ME && !(shareOf(x, ME) > 0)) { err('Questa spesa non ti riguarda: non hai pagato e la tua quota è zero.'); return; }
    // persone nuove o tornate: entrano nell'elenco delle Condivise
    const idMap = {};
    ppl.filter(p => p.on && !p.me).forEach(p => {
      if (p.fresh) { const np = {id: uid(), name: p.name}; if (p.handle) np.handle = p.handle; S.people.push(np); idMap[p.id] = np.id; }
      else if (p.revive) { const op = S.people.find(q => q.id === p.id); if (op) op.archived = false; }
    });
    const fix = i => idMap[i] || i;
    const item = {id: uid(), date, desc, amount: a, payer: fix(x.payer), split: sel.map(fix)};
    if (r.weights) { item.weights = {}; Object.entries(r.weights).forEach(([k, v]) => item.weights[fix(k)] = v); }
    const mine = cents(shareOf(item, ME));
    if (mine > 0) {
      const pe = {id: uid(), date, desc: (desc || 'Spesa condivisa') + ' (condivisa)', category: cat, type: 'out', amount: mine, shared: item.id};
      E.items.push(pe); item.linked = pe.id;
    }
    S.items.push(item); ui.expMonth = date.slice(0, 7); save(); closeSheet(); renderMain();
    toast(mine > 0 ? `Divisa. La tua quota di ${EUR(mine)} è nelle tue spese.` : 'Spesa condivisa registrata.');
    // chi ha un account Tacuìn riceve solo un avviso: nei suoi dati non viene scritto nulla
    if (REMOTE && USER) item.split.forEach(pid => {
      const p = S.people.find(q => q.id === pid); if (!p?.handle) return;
      api('api/share/notify', {handle: p.handle, desc: desc || cat, quota: cents(shareOf(item, pid)), total: a, payer_is_me: item.payer === ME, payer: item.payer === ME ? '' : pName(item.payer)}).catch(() => {});
    });
  });
  drawType(); drawShare();
  setTimeout(() => (o.amount ? f.desc : f.amt).focus(), 60);
  return sh;
}

function fabActions() {
  const A = actionMap();
  const order = {
    expenses: ui.expTab === 'shared' ? ['shared', 'out', 'in', 'habit', 'inv', 'row', 'tracker'] : ['out', 'shared', 'in', 'habit', 'inv', 'row', 'tracker'],
    habits: ['habit', 'out', 'shared', 'in', 'inv', 'row', 'tracker'],
    investments: ['inv', 'out', 'shared', 'in', 'habit', 'row', 'tracker'],
    tracker: ['row', 'tracker', 'out', 'shared', 'in', 'habit', 'inv'],
    gym: ['gym', 'habit', 'out', 'shared', 'in', 'inv', 'row', 'tracker'],
    calendar: ['app', 'todo', 'out', 'gym', 'journal', 'habit', 'shared', 'in', 'inv', 'row', 'tracker'],
    journal: ['journal', 'todo', 'app', 'out', 'habit', 'gym', 'shared', 'in', 'inv', 'row', 'tracker']
  }[state.view] || ['out', 'shared', 'in', 'habit', 'inv', 'row', 'tracker'];
  if (!order.includes('app')) order.splice(order.indexOf('out') + 1, 0, 'app');
  if (!order.includes('todo')) order.splice(order.indexOf('app') + 1, 0, 'todo');
  if (!order.includes('journal')) order.push('journal');
  if (!order.includes('gym')) order.splice(state.gym?.active ? 0 : order.indexOf('habit') + 1, 0, 'gym');
  if (!order.includes('receipt')) order.splice(order.indexOf('out') + 1, 0, 'receipt');
  if (!order.includes('trip')) order.push('trip');
  return order.map(k => A[k]).filter(Boolean);
}

/* ---------- aspetto: automatico, chiaro, scuro, luce calda ---------- */
const LOOK = {
  get() { let p = {}; try { p = JSON.parse(localStorage.getItem('tacuin-look') || '{}') || {}; } catch (e) {}
    if (!p.theme) { let o = null; try { o = localStorage.getItem('tracker-theme'); } catch (e) {} p.theme = o === 'light' || o === 'dark' ? o : 'auto'; }
    return {theme: p.theme, night: !!p.night, from: p.from || '21:00', to: p.to || '07:00', size: p.size || 'm'}; },
  set(p, remote = true) {
    try { localStorage.setItem('tacuin-look', JSON.stringify(p)); localStorage.removeItem('tracker-theme'); } catch (e) {}
    const root = document.documentElement; root.classList.add('theme-anim'); lookApply(p); syncThemeSw();
    setTimeout(() => root.classList.remove('theme-anim'), 350);
    if (remote && USER) api('api/me/look', p).then(j => { USER.settings = {...(USER.settings || {}), look: j.look}; }).catch(() => {});
  }
};
function syncThemeSw() { const sw = $('#themeSw'); if (sw) sw.setAttribute('aria-checked', document.documentElement.getAttribute('data-theme') === 'dark' ? 'true' : 'false'); }
(function () {
  const sw = $('#themeSw');
  syncThemeSw();
  sw.onclick = () => { const p = LOOK.get(); p.theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; LOOK.set(p); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { lookApply(LOOK.get()); syncThemeSw(); });
  setInterval(() => { const p = LOOK.get(); if (p.night) { lookApply(p); syncThemeSw(); } }, 60000);  // la sera passa da solo alla luce calda
})();

  const hint = () => { sh.querySelector('#lkHint').textContent = {auto: 'Segue il telefono o il computer: chiaro di giorno, scuro quando lo imposti lì.', light: 'Sempre chiaro.', dark: 'Sempre scuro: riposa la vista al buio e consuma meno batteria sugli schermi OLED.', warm: 'Carta color avorio, inchiostro marrone e niente blu: riposa la vista la sera e nelle lunghe sessioni.'}[LOOK.get().theme]; };
  hint();

  sh.querySelector('#lkTh').onclick = e => { const b = e.target.closest('[data-th]'); if (!b) return; const q = LOOK.get(); q.theme = b.dataset.th; LOOK.set(q);
    sh.querySelectorAll('[data-th]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); hint(); };
  sh.querySelector('#lkNight').onchange = e => { const q = LOOK.get(); q.night = e.target.checked; LOOK.set(q); sh.querySelector('#lkHours').hidden = !q.night; };
  ['#lkFrom', '#lkTo'].forEach(id => sh.querySelector(id).onchange = () => { const q = LOOK.get(); q.from = sh.querySelector('#lkFrom').value || '21:00'; q.to = sh.querySelector('#lkTo').value || '07:00'; LOOK.set(q); });
  sh.querySelector('#lkSize').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; const q = LOOK.get(); q.size = b.dataset.v; LOOK.set(q); sh.querySelectorAll('#lkSize button').forEach(x => x.classList.toggle('on', x === b)); };
}

const BOT_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/></svg>';
let chatLog = null, chatBusy = false;
const chatKey = () => 'tracker-chat-' + (USER ? USER.id : 'x');
function loadChat() {
  if (chatLog) return chatLog;
  try { chatLog = JSON.parse(localStorage.getItem(chatKey()) || '[]'); } catch (e) { chatLog = []; }
  if (!Array.isArray(chatLog)) chatLog = [];
  if (!chatLog.length) chatLog.push({id: uid(), who: 'bot', html: `Ciao ${esc(USER.name)}! 👋 Scrivimi come scriveresti a un amico, per esempio:\n\n<b>38,90 esselunga</b> · <b>ieri 40 benzina e 12 pranzo</b>\n<b>fatto acqua</b> · <b>progetti</b> · <b>da fare</b>\n<b>quanto ho speso in svago a ottobre?</b> · <b>analisi</b>`});
  return chatLog;
}
function saveChat() { try { localStorage.setItem(chatKey(), JSON.stringify(chatLog.slice(-60))); } catch (e) {} }
/* il testo del bot è HTML semplice: tengo solo <b>, <i>, <code> */
function cleanHTML(html) {
  const t = document.createElement('template'); t.innerHTML = String(html || '');
  const walk = node => [...node.childNodes].forEach(n => {
    if (n.nodeType === 1) {
      if (['B', 'I', 'CODE', 'BR'].includes(n.tagName)) { [...n.attributes].forEach(a => n.removeAttribute(a.name)); walk(n); }
      else n.replaceWith(document.createTextNode(n.textContent));
    } else if (n.nodeType !== 3) n.remove();
  });
  walk(t.content);
  const d = document.createElement('div'); d.appendChild(t.content); return d.innerHTML;
}
function msgHTML(x) {
  if (x.who === 'me') return `<div class="msg me" data-m="${x.id}"><div class="bub">${esc(x.text)}</div></div>`;
  const chart = x.chart ? `<div class="mchart">${x.chart.map(c => `<div><span class="b" style="height:${Math.max(2, c.value / (Math.max(...x.chart.map(k => k.value)) || 1) * 56)}px" title="${esc(EUR(c.value))}"></span>${esc(c.label)}</div>`).join('')}</div>` : '';
  const btns = (x.buttons || []).length ? `<div class="qbtns">${x.buttons.flat().map(b => `<button data-act="${esc(b.data)}">${esc(b.text)}</button>`).join('')}</div>` : '';
  return `<div class="msg bot ${x.typing ? 'typing' : ''}" data-m="${x.id}"><div class="bot-av">${BOT_ICON}</div><div class="col"><div class="bub">${cleanHTML(x.html)}${chart}</div>${btns}</div></div>`;
}
function drawChat(scroll = true) {
  drawAssist(scroll);
  const log = $('#chatLog'); if (!log) return;
  log.innerHTML = loadChat().map(msgHTML).join('');
  if (scroll) log.scrollTop = log.scrollHeight;
}
async function syncSilently() { // aggiorna i dati dopo un comando senza ridisegnare la chat
  try { const j = await api('api/state'); if (j.state && !dirty) { const v = state.view, a = state.active; state = migrate(j.state); rev = j.rev; state.view = v; state.active = a; renderNav();
    if (v !== 'chat' && !document.querySelector('#main :focus')) renderMain(); } } catch (e) {}
}
async function sendChat(text) {
  text = String(text || '').trim();
  if (!text || chatBusy) return;
  if (dirty) await pushRemote();
  chatBusy = true;
  loadChat().push({id: uid(), who: 'me', text});
  const wait = {id: uid(), who: 'bot', html: '…', typing: true};
  chatLog.push(wait); drawChat();
  try {
    const j = await api('api/chat', {text});
    chatLog.splice(chatLog.indexOf(wait), 1, ...j.messages.map(m => ({id: uid(), who: 'bot', html: m.html, buttons: m.buttons, chart: m.chart})));
    syncSilently();
  } catch (e) {
    chatLog.splice(chatLog.indexOf(wait), 1, {id: uid(), who: 'bot', html: '⚠️ ' + esc(e.message)});
  }
  chatBusy = false; saveChat(); drawChat();
}
async function chatAction(msgId, data) {
  try {
    const r = await api('api/chat/action', {data});
    if (r.toast) toast(r.toast);
    const i = chatLog.findIndex(x => x.id === msgId);
    if (r.edit && i >= 0) chatLog[i] = {...chatLog[i], html: r.edit.html, buttons: r.edit.buttons, chart: null};
    if (r.new) chatLog.push({id: uid(), who: 'bot', html: r.new.html, buttons: r.new.buttons});
    saveChat(); drawChat(!r.edit || !!r.new); syncSilently();
  } catch (e) { toast(e.message); }
}

function tripWhen(t) {
  const now = today(), end = t.end || t.start;
  if (t.start <= now && now <= end) return {label: 'in corso', n: 0, cls: 'now'};
  if (now < t.start) { const n = Math.round((new Date(t.start) - new Date(now)) / 864e5); return {label: n === 1 ? 'domani' : `tra ${n} giorni`, n, cls: ''}; }
  return {label: 'concluso', n: -1, cls: 'past'};
}

  });

  if (isNew && !matchMedia('(max-width:760px)').matches) sh.querySelector('#apT').focus();

function calPanel() {

/* ---------- DA FARE DEL GIORNO ---------- */
/* quelle non fatte restano su «oggi» finché non le spunti (con la scritta «rimandata») */
function todosFor(k) {
  const t = today();
  return state.todos.filter(x => x.date === k || (k === t && !x.done && x.date < t)).sort((a, b) => (a.done - b.done) || (a.date || '').localeCompare(b.date || ''));
}
const todoForm = k => `<form class="tdadd" data-k="${k}"><span class="muted">${ico('plus', 18, 2.2)}</span><input class="field flat" placeholder="Aggiungi una cosa da fare…" aria-label="Nuova cosa da fare" maxlength="200" enterkeyhint="done"></form>`;
document.addEventListener('submit', e => {
  const f = e.target.closest('.tdadd'); if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'), v = inp.value.trim(); if (!v) return;
  state.todos.push({id: uid(), text: v.slice(0, 200), date: f.dataset.k || today(), done: false, created: today()});
  save(); renderMain();
  setTimeout(() => document.querySelector(`.tdadd[data-k="${f.dataset.k}"] input`)?.focus(), 0);
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tdtoggle]');
  if (b) { const x = state.todos.find(y => y.id === b.dataset.tdtoggle); if (!x) return; x.done = !x.done; x.doneOn = x.done ? today() : null; if (x.done && x.date < today()) x.date = today(); save(); renderMain(); return; }

});

const gmTopOn = () => !!(REMOTE && USER && state.garmin && typeof state.garmin === 'object');
/* passi e battito si aggiornano da soli se hanno più di 10 minuti (una richiesta alla volta) */
async function gmMaybeRefresh(force) {
  const at = state.garmin?.at || 0;
  if (ui._gmBusy || (!force && Date.now() / 1000 - at < 600)) return;
  ui._gmBusy = true;
  try { await api('api/garmin', {action: 'wellness'}); const s2 = await api('api/state'); applyRemote(s2); }
  catch (e) { /* Garmin non raggiungibile: restano i dati salvati */ }
  finally { setTimeout(() => { ui._gmBusy = false; }, 60000); }
}
const GM_IC = t => /run|walk|hik/.test(t) ? 'run' : /cycl|bik|ride/.test(t) ? 'bike' : /swim/.test(t) ? 'swim' : /climb|boulder/.test(t) ? 'climb'
  : /strength/.test(t) ? 'dumbbell' : /row/.test(t) ? 'row' : /yoga|pilates|stretch|flex|breath/.test(t) ? 'stretch' : 'watch';
function gmDay(ms) {
  const d = new Date(ms), k = iso(d), n = Math.round((new Date(today()) - new Date(k)) / 864e5);
  const hm = d.toTimeString().slice(0, 5);
  if (n === 0) return 'Oggi · ' + hm;
  if (n === 1) return 'Ieri · ' + hm;
  if (n < 7) { const g = d.toLocaleDateString('it-IT', {weekday: 'long'}); return g[0].toUpperCase() + g.slice(1) + ' · ' + hm; }
  return `${d.getDate()} ${MESI3[d.getMonth()]} · ${hm}`;
}
const nfmt = n => String(Math.round(Number(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); // 6.482 (anche sotto le 10.000)
function garminTopHTML() {

      <div class="gm-st"><span class="lb"><span style="color:#c4473a;display:flex">${ico('heart', 16)}</span>Battito<span class="hide-m">, ultimi 5 min</span></span>
        <div><b class="big">${hr.last5 || '—'}</b> <span class="muted">${hr.last5 ? 'bpm' : ''}</span>${hrWhen ? `<small class="gm-when"><span class="show-m">ultimi 5 min&nbsp;·&nbsp;</span>${hrWhen}</small>` : ''}</div>
        ${spark}

    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { SW.p = null; return; }
    if (dx < -12 && Math.abs(dx) > Math.abs(dy)) { p.on = true; const st = swStrip(p.row); st.style.transition = 'none'; p.w = st.offsetWidth || 160; }

/* ---------- CESTINO ---------- */
/* Quello che elimini resta qui 30 giorni: si ripristina dov'era, o si elimina per sempre. */
const TRASH_K = {tracker: ['table', 'Progetto', 1, 'due'], trip: ['plane', 'Viaggio', 1, 'trip'], habit: ['habit', 'Abitudine', 1, 'hab'], course: ['class', 'Corso', 1, 'gym'],
  template: ['list', 'Scheda', 1, 'gym'], row: ['check', 'Voce di progetto', 0, 'due'], expense: ['wallet', 'Spesa', 0, 'exp'], shared: ['users', 'Spesa condivisa', 0, 'exp'],
  settle: ['swap', 'Saldo', 0, 'exp'], investment: ['trend', 'Investimento', 0, ''], event: ['cal', 'Appuntamento', 0, 'app'], session: ['gym', 'Allenamento', 0, 'gym'],
  todo: ['check', 'Da fare', 0, 'todo'], journal: ['journal', 'Diario', 0, 'jou']};
function toTrash(kind, data, label, sub, meta, quiet) {
  const e = {id: uid(), kind, at: Date.now(), label: String(label || 'Senza titolo').slice(0, 120), sub: String(sub || '').slice(0, 160), data: JSON.parse(JSON.stringify(data)), meta: meta || {}};
  state.trash.unshift(e); save(); renderNav();
  if (!quiet) toast(`«${e.label}» nel cestino`, {label: 'Annulla', act: () => restoreTrash(e.id)});
  return e;
}
function restoreTrash(id) {
  const e = state.trash.find(x => x.id === id); if (!e) return false;
  const at = (arr, i, x) => { if (!arr.some(y => y.id === x.id)) arr.splice(Math.min(i ?? arr.length, arr.length), 0, x); };
  const d = JSON.parse(JSON.stringify(e.data)), m = e.meta || {};
  switch (e.kind) {
    case 'tracker': at(state.trackers, m.i, d); break;
    case 'row': { const t = state.trackers.find(x => x.id === m.tid); if (!t) { toast(`Prima ripristina il progetto «${m.tname || ''}».`); return false; } at(t.rows, m.i, d); break; }
    case 'expense': at(state.expenses.items, m.i, d); break;
    case 'shared': at(SH().items, m.i, d); if (m.linked) at(state.expenses.items, m.li, m.linked); break;
    case 'settle': at(SH().settlements, m.i, d); break;
    case 'investment': at(state.investments.items, m.i, d); break;
    case 'habit': at(state.habits.list, m.i, d); break;
    case 'trip': at(state.trips, m.i, d); break;
    case 'event': at(state.calendar.events, m.i, d); break;
    case 'session': at(G().sessions, m.i, d); break;
    case 'template': at(G().templates, m.i, d); break;
    case 'course': at(G().courses, m.i, d); break;
    case 'todo': at(state.todos, m.i, d); break;
    case 'journal': { const c = state.journal.entries[m.k]; if (c && c.text && c.text !== d.text) d.text = d.text + '\n\n' + c.text; state.journal.entries[m.k] = d; break; }
    default: toast('Questo elemento non si può ripristinare.'); return false;
  }
  state.trash = state.trash.filter(x => x !== e); save(); render(); toast(`Ripristinato: ${e.label}`); return true;
}
const agoTxt = ms => { const d = Math.floor((Date.now() - ms) / 864e5); return d <= 0 ? 'oggi' : d === 1 ? 'ieri' : `${d} giorni fa`; };
function renderTrash() {
  const m = $('#main'), T = state.trash, f = ui.trashF || 'all';
  const isPage = x => TRASH_K[x.kind]?.[2], pages = T.filter(isPage), items = T.filter(x => !isPage(x));
  const row = x => { const k = TRASH_K[x.kind] || ['trash', '', 0, ''], left = TRASH_DAYS - Math.floor((Date.now() - x.at) / 864e5);
    return `<div class="trow" data-t="${x.id}"><span class="gtile ${k[3] ? 'tt t-' + k[3] : ''}" style="${k[3] ? '' : 'background:var(--tile)'}">${ico(k[0], 20)}</span>
      <span class="tx"><b>${esc(x.label)}</b><small>${esc(x.sub || k[1])}</small></span>
      <span class="when">${agoTxt(x.at)}${left <= 5 ? ` · sparisce tra ${Math.max(0, left)} ${left === 1 ? 'giorno' : 'giorni'}` : ''}</span>
      <span class="acts"><button class="ghost" data-restore>${ico('restore', 16)}<span class="hide-m">Ripristina</span></button><button class="mini more dangerbtn" data-kill aria-label="Elimina per sempre" title="Elimina per sempre">${ico('trash', 18)}</button></span></div>`; };
  const block = (title, arr) => arr.length ? `<section class="pnl tblock"><h2>${title}</h2><div>${arr.map(row).join('')}</div></section>` : '';
  m.innerHTML = `
    <div class="head">${hIcon('trash')}<h1 class="title">Cestino</h1>${T.length ? `<button class="ghost dangerbtn" id="trEmpty" style="margin-left:auto">${ico('trash', 16)}Svuota cestino</button>` : ''}</div>
    <p class="muted" style="margin:-6px 0 14px;font-size:14px;max-width:720px">Quello che elimini resta qui ${TRASH_DAYS} giorni, poi sparisce da solo. Puoi ripristinarlo nel punto esatto dove era, o eliminarlo subito per sempre.</p>
    ${T.length ? `<div class="calf" id="trF">${[['all', 'Tutto', T.length], ['pages', 'Pagine', pages.length], ['items', 'Contenuti', items.length]].map(([v, l, n]) => `<button class="${f === v ? 'sel' : ''}" data-f="${v}">${l} · ${n}</button>`).join('')}</div>
      <div class="tlist">${f !== 'items' ? block('Pagine', pages) : ''}${f !== 'pages' ? block('Contenuti', items) : ''}</div>`
      : `<div class="empty" style="margin-top:8vh"><p style="display:flex;justify-content:center;color:var(--muted);margin:0">${ico('trash', 40, 1.5)}</p><p>Il cestino è vuoto.</p></div>`}`;
  $('#trEmpty')?.addEventListener('click', async () => { if (!await confirmSheet({title: 'Svuotare il cestino?', text: `${T.length} ${T.length === 1 ? 'elemento verrà eliminato' : 'elementi verranno eliminati'} per sempre: non si potranno più recuperare.`, ok: 'Svuota il cestino'})) return; state.trash = []; save(); render(); toast('Cestino svuotato.'); });
  $('#trF')?.addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { ui.trashF = b.dataset.f; renderMain(); } });
  m.querySelectorAll('.trow').forEach(r => r.addEventListener('click', e => { const id = r.dataset.t;
    if (e.target.closest('[data-restore]')) restoreTrash(id);
    if (e.target.closest('[data-kill]')) { const x = state.trash.find(y => y.id === id); if (x) confirmSheet({title: `Eliminare per sempre «${x.label}»?`, text: 'Non si potrà più recuperare.', ok: 'Elimina per sempre'}).then(ok => { if (ok) { state.trash = state.trash.filter(y => y !== x); save(); render(); } }); } }));
}

/* foto del telefono (anche 12 MP) → JPEG di max 2000 px: più veloce da inviare e leggere */
function shrinkImage(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      if (k === 1 && file.size < 3e6) return res(file);
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), 'image/jpeg', 0.88);
    };
    img.onerror = () => res(file);
    img.src = rc.img;
  });
}

    e.preventDefault();

    const x = {desc: $('#rcM').value.trim() || 'Scontrino', amount: Math.round(amt * 100) / 100, date: $('#rcD').value || today(), category: $('#rcC').value};

    if ($('#rcSh').checked) {
      state.view = 'expenses'; ui.expTab = 'personal'; save(); render();
      expenseSheet({...x, type: 'out', share: true});
      return;
    }
    state.expenses.items.push({id: uid(), date: x.date, desc: x.desc, category: x.category, type: 'out', amount: x.amount});
    ui.expMonth = x.date.slice(0, 7); state.view = 'expenses'; ui.expTab = 'personal'; save(); render();

function renderAuth(info, mode) {

  }
  if (mode === 'reset') {
    const a = authShell(`<form class="auth-card">
      <b>Scegli una nuova password</b>
      <label class="f">Nuova password<input class="field" name="password" type="password" required minlength="8" autocomplete="new-password"></label>

  const pw = (name, ac, extra = '') => `<span class="pw"><input class="field" name="${name}" type="password" required ${extra} autocomplete="${ac}"><button type="button" class="pw-eye" data-eye aria-label="Mostra la password">Mostra</button></span>`;
  const fromIg = /[?&]da=instagram\b/.test(location.search);
  const src = (v, l) => `<label class="src"><input type="radio" name="source" value="${v}" ${fromIg && v === 'instagram' ? 'checked' : ''}><span>${l}</span></label>`;
  const a = authShell(mode === 'login' ? `<form class="auth-card" autocomplete="on">${tabs}
      <label class="f">Email<input class="field" name="email" type="email" required autocomplete="username" inputmode="email" autocapitalize="none"></label>
      <label class="f">Password${pw('password', 'current-password')}</label>
      <label class="chk"><input type="checkbox" name="remember" checked>Resta collegato su questo dispositivo</label>
      <p class="auth-err" role="alert"></p>
      <button class="primary" type="submit">Accedi</button>
      <button type="button" class="linkbtn auth-forgot" data-contact>Password dimenticata?</button></form>`
    : `<form class="auth-card" autocomplete="on" novalidate>${tabs}
      <div class="auth-steps" aria-hidden="true"><i class="on"></i><i data-bar2></i><span data-stepn>Passo 1 di 2</span></div>
      <div class="auth-step" data-step="1">
        <label class="f">Nome<input class="field" name="name" required autocomplete="name"></label>
        <label class="f">Nome utente<span class="hdl"><span aria-hidden="true">@</span><input class="field" name="handle" required minlength="3" maxlength="24" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="es. mario.rossi"><b class="hdl-st" aria-live="polite"></b></span><small class="muted">Serve agli altri per trovarti. La tua email resta nascosta.</small></label>
        <label class="f">Email<input class="field" name="email" type="email" required autocomplete="email" inputmode="email" autocapitalize="none"></label>
        <label class="f">Password${pw('password', 'new-password', 'minlength="8"')}<small class="muted">Almeno 8 caratteri, con lettere e numeri.</small></label>
        <p class="auth-err" role="alert"></p>
        <button class="primary" type="button" data-next>Continua</button>
      </div>
      <div class="auth-step" data-step="2" hidden>
        <div class="f">Come ci hai conosciuto? <span class="muted">(facoltativo)</span><div class="srcs">${src('instagram', 'Instagram')}${src('amici', 'Amici')}${src('ricerca', 'Ricerca su internet')}${src('altro', 'Altro')}</div></div>
        <div class="auth-line"></div>
        <div class="consents">
          <label class="chk"><input type="checkbox" name="accept_privacy"><span>Ho letto l'<a href="/privacy" target="_blank" rel="noopener">informativa privacy</a> e ho almeno 18 anni</span></label>
          <label class="chk"><input type="checkbox" name="accept_terms"><span>Accetto le <a href="/condizioni" target="_blank" rel="noopener">condizioni d'uso</a> della versione di prova</span></label>
          <label class="chk"><input type="checkbox" name="accept_clauses"><span>Approvo specificamente le clausole 2, 3, 4 e 7 delle condizioni (artt. 1341 e 1342 c.c.) <button type="button" class="linkbtn" data-clauses>quali sono?</button><small class="muted" data-clauses-t hidden> Natura sperimentale del servizio, esclusione di garanzie, limitazione di responsabilità, sospensione o interruzione del servizio.</small></span></label>
        </div>
        <p class="auth-err" role="alert"></p>
        <button class="primary" type="submit">Invia richiesta</button>
        <button type="button" class="linkbtn auth-back" data-back>← Indietro</button>
        <p class="muted auth-small">Riceverai un'email per confermare l'indirizzo. Potrai entrare quando l'amministratore approva la richiesta.</p>
      </div></form>`);
  a.addEventListener('click', e => {
    const eye = e.target.closest('[data-eye]');
    if (eye) { const i = eye.previousElementSibling, show = i.type === 'password'; i.type = show ? 'text' : 'password'; eye.textContent = show ? 'Nascondi' : 'Mostra'; eye.setAttribute('aria-label', show ? 'Nascondi la password' : 'Mostra la password'); return; }
    if (e.target.closest('[data-clauses]')) { e.preventDefault(); const t = a.querySelector('[data-clauses-t]'); t.hidden = !t.hidden; return; }

  a.querySelectorAll('[data-m]').forEach(b => b.onclick = () => renderAuth(info, b.dataset.m));
  const hIn = a.querySelector('input[name="handle"]'); if (hIn) handleCheck(hIn, a.querySelector('.hdl-st'));
  bindForm(a.querySelector('form'), async d => {

      const creds = {email: d.email, password: d.password, remember: !!d.remember};
      const j = await api('api/login', creds);
      if (j.need_totp) { renderTotpStep(info, a, creds); return; }
      location.reload();
    }
    else {
      if (!(d.accept_privacy && d.accept_terms && d.accept_clauses)) throw new Error('Servono tutte e tre le conferme.');
      const j = await api('api/register', {...d, accept_privacy: !!d.accept_privacy, accept_terms: !!d.accept_terms, accept_clauses: !!d.accept_clauses});
      a.querySelector('form').innerHTML = `<p class="auth-ok">${esc(j.message)}</p><button class="ghost" type="button" id="backLogin">Torna all'accesso</button>`;
      $('#backLogin').onclick = () => renderAuth(info, 'login');
    }
  });
  a.querySelector('input')?.focus();
}

let qrP = null;
function loadQR() {  // libreria qrcode-generator (MIT), nella cartella vendor: nessun servizio esterno

const otpClean = v => String(v || '').replace(/\s+/g, '');

/* ---------- APP INSTALLABILE E NOTIFICHE (al posto di Telegram) ---------- */
const PWA = {
  ios: /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  android: /android/i.test(navigator.userAgent),
  standalone: () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
  canPush: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext,
  install: null,  // evento beforeinstallprompt (Chrome/Edge su Android e computer)
  device() {
    const u = navigator.userAgent;
    const os = /iphone/i.test(u) ? 'iPhone' : /ipad/i.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? 'iPad' : /android/i.test(u) ? 'Android' : /mac/i.test(u) ? 'Mac' : /win/i.test(u) ? 'Windows' : /linux/i.test(u) ? 'Linux' : 'Dispositivo';
    const br = /edg\//i.test(u) ? 'Edge' : /firefox|fxios/i.test(u) ? 'Firefox' : /chrome|crios/i.test(u) ? 'Chrome' : /safari/i.test(u) ? 'Safari' : '';
    return (this.standalone() ? `${os} (app)` : br ? `${os} · ${br}` : os);
  },
  async reg() { return navigator.serviceWorker.ready; },
  async sub() { try { return await (await this.reg()).pushManager.getSubscription(); } catch (e) { return null; } },
  async enable() {
    if (!this.canPush()) throw new Error(this.ios && !this.standalone() ? 'Su iPhone e iPad prima aggiungi Tacuìn alla schermata Home (vedi sotto), poi aprilo dall\'icona.' : 'Questo browser non supporta le notifiche.');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error(perm === 'denied' ? 'Le notifiche sono bloccate per Tacuìn: riattivale dalle impostazioni del browser o del telefono.' : 'Non hai dato il permesso alle notifiche.');
    const {key, ok} = await api('api/push/key');
    if (!ok || !key) throw new Error('Le notifiche non sono disponibili su questo server.');
    const r = await this.reg();
    let s = await r.pushManager.getSubscription();
    const want = b64ToBytes(key);
    if (s && s.options?.applicationServerKey && !sameBytes(new Uint8Array(s.options.applicationServerKey), want)) { await s.unsubscribe(); s = null; }
    if (!s) s = await r.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: want});
    await api('api/push/subscribe', {subscription: s.toJSON(), device: this.device()});
    return s;
  },
  async disable() {
    const s = await this.sub();
    if (s) { try { await api('api/push/unsubscribe', {endpoint: s.endpoint}); } catch (e) {} await s.unsubscribe().catch(() => {}); }
  },
  async resync() {  // all'apertura: se questo dispositivo è iscritto, il server lo sa (anche dopo un ripristino)
    if (!USER || !this.canPush() || Notification.permission !== 'granted') return;
    const s = await this.sub(); if (!s) return;
    try { await api('api/push/subscribe', {subscription: s.toJSON(), device: this.device()}); } catch (e) {}
  }
};
const b64ToBytes = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
const sameBytes = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.install = e; if (state.view === 'profile') drawPushPanel(); });
window.addEventListener('appinstalled', () => { PWA.install = null; toast('Tacuìn è installato: lo trovi tra le app.'); });
function installHelpHTML() {
  if (PWA.standalone()) return '';
  if (PWA.install) return `<div class="row-btns"><button class="ghost" id="pwaInstall">${ico('down', 16)}Installa Tacuìn come app</button></div>`;
  if (PWA.ios) return `<div class="inst"><b>Installa Tacuìn sull'${/ipad/i.test(navigator.userAgent) ? 'iPad' : 'iPhone'}</b><ol><li>In Safari tocca <b>Condividi</b> ${ico('upload', 15)} in basso</li><li>Scegli <b>«Aggiungi alla schermata Home»</b></li><li>Apri Tacuìn dalla nuova icona e attiva qui le notifiche</li></ol></div>`;

}
async function drawPushPanel() {

  const sub = can ? await PWA.sub() : null;
  let devs = []; try { devs = (await api('api/push/devices')).devices; } catch (e) {}
  const here = sub && devs.some(d => d.endpoint === sub.endpoint);
  const st = here ? ['on', 'Attive su questo dispositivo'] : perm === 'denied' ? ['off', 'Bloccate in questo browser'] : !can ? ['off', PWA.ios && !PWA.standalone() ? 'Prima installa Tacuìn (vedi sotto)' : 'Non supportate da questo browser'] : ['', 'Non attive su questo dispositivo'];

}

    openMenu(b, [
      ...(USER.role === 'root' ? [{label: u.role === 'admin' ? 'Rendi Utente' : 'Rendi Admin', act: () => act(u.id, 'role', u.role === 'admin' ? 'user' : 'admin')}] : []),
      u.status === 'active' ? {label: 'Disattiva', act: async () => await confirmSheet({title: `Disattivare ${u.name}?`, text: 'Non potrà più accedere finché non lo riattivi. I suoi dati restano.', ok: 'Disattiva'}) && act(u.id, 'disable')}
                            : {label: 'Riattiva', act: () => act(u.id, 'enable')},
      {label: 'Link per nuova password', act: () => act(u.id, 'reset_link')},
      ...(u.totp ? [{label: 'Azzera la verifica in due passaggi', act: async () => await confirmSheet({title: 'Azzerare la verifica in due passaggi?', text: `${esc(u.name)} potrà entrare con la sola password e tutte le sue sessioni verranno chiuse.`, ok: 'Azzera'}) && act(u.id, 'totp_reset')}] : []),
      u.invites_off ? {label: 'Riattiva gli inviti agli appuntamenti', act: () => act(u.id, 'invites_on')}
                    : {label: 'Disattiva gli inviti agli appuntamenti', act: () => act(u.id, 'invites_off')},
      {label: 'Chiudi tutte le sessioni', act: () => act(u.id, 'logout_all')},
      {sep: true},
      {label: 'Elimina account e dati', danger: true, act: async () => await confirmSheet({title: `Eliminare ${u.name}?`, text: 'Elimina per sempre l\'account e tutti i suoi dati. Non si può annullare.', ok: 'Elimina per sempre', input: {label: 'Per confermare scrivi ELIMINA', match: 'ELIMINA'}}) === 'ELIMINA' && act(u.id, 'delete')}
    ]);
  });
}
function showLink(msg, link) {
  closeMenu();
  const box = document.createElement('div');
  box.className = 'menu'; box.style.cssText = 'left:50%;top:30%;transform:translateX(-50%);width:min(460px,calc(100vw - 32px));padding:16px;gap:10px;white-space:normal';
  box.innerHTML = `<b>${esc(msg)}</b><div class="muted" style="font-size:13px">Invia questo link alla persona: aprendolo potrà scegliere una nuova password.</div>
    <div class="linkbox"><span style="flex:1">${esc(link)}</span></div><div class="row-btns"><button class="primary" data-c>Copia link</button><button class="ghost" data-x>Chiudi</button></div>`;
  document.body.appendChild(box); menuEl = box;
  box.querySelector('[data-c]').onclick = () => { navigator.clipboard?.writeText(link); toast('Link copiato.'); };
  box.querySelector('[data-x]').onclick = closeMenu;
}

/* ---------- REGISTRO ATTIVITÀ (admin) ---------- */
const AUDIT_LABEL = {'login': 'Accesso', 'login.fail': 'Accesso fallito', 'user.register': 'Richiesta di accesso', 'user.create': 'Account creato',
  'admin.approve': 'Approvato', 'admin.reject': 'Rifiutato', 'admin.disable': 'Disattivato', 'admin.enable': 'Riattivato', 'admin.role': 'Ruolo cambiato',
  'admin.logout_all': 'Sessioni chiuse', 'admin.invites_off': 'Inviti disattivati', 'admin.totp_reset': 'Verifica in due passaggi azzerata', 'user.totp_recovery': 'Codice di recupero usato', 'admin.invites_on': 'Inviti riattivati', 'user.totp_on': 'Verifica in due passaggi attivata', 'user.totp_off': 'Verifica in due passaggi disattivata', 'login.totp_fail': 'Codice di verifica sbagliato', 'admin.reset_link': 'Link nuova password', 'admin.delete': 'Account eliminato', 'user.password': 'Password cambiata',
  'user.email': 'Email cambiata', 'sessions.revoke': 'Uscita da tutti i dispositivi', 'telegram.link': 'Telegram collegato', 'telegram.unlink': 'Telegram scollegato', 'push.subscribe': 'Notifiche attivate su un dispositivo',
  'user.self_delete': "Account eliminato dall'utente"};
async function renderAudit() {
  const m = $('#main');
  m.innerHTML = `<div class="head">${hIcon('list')}<h1 class="title">Registro attività</h1></div><p class="hint">Caricamento…</p>`;
  let j; try { j = await api('api/admin/audit'); } catch (x) { m.querySelector('.hint').textContent = x.message; return; }
  m.innerHTML = `<div class="head">${hIcon('list')}<h1 class="title">Registro attività</h1></div>
    <div class="boxed"><table class="utable cardt"><thead><tr><th>Quando</th><th>Chi</th><th>Cosa</th><th>Su chi</th><th>Dettagli</th><th>IP</th></tr></thead>
    <tbody>${j.items.map(i => `<tr><td data-l="Quando">${esc(fmtWhen(i.ts))}</td><td data-l="Chi">${esc(i.actor_name || (i.actor_id === 'system' ? 'Sistema' : '—'))}</td>
      <td class="w ${i.action === 'login.fail' ? 'neg' : ''}" style="order:-1"><b style="font-weight:500">${esc(AUDIT_LABEL[i.action] || i.action)}</b></td><td data-l="Su chi">${esc(i.target_name || '—')}</td>
      <td class="muted w2 ${i.detail ? '' : 'emp'}">${esc(i.detail || '')}</td><td class="muted" data-l="IP">${esc(i.ip || '')}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Nessuna attività.</td></tr>'}</tbody></table></div>
    <p class="hint">Ultime 300 operazioni su accessi e account. Le voci più vecchie di 12 mesi vengono cancellate da sole.</p>`;
}
$('#meChip').onclick = () => { state.view = 'profile'; closeNav(); render(); };
$('#trashBtn').onclick = () => { state.view = 'trash'; closeNav(); render(); };
$('#menuEdit').onclick = () => { closeNav(); menuSheet(); };

/* ---------- avvio e sincronizzazione ---------- */
async function poll() {
  if (!REMOTE || dirty || inflight || document.hidden || menuEl || sheetEl || !fabMenu.hidden) return;
  const ae = document.activeElement;
  if (ae && ae.matches && ae.matches('input,select,textarea')) return; // non disturbare mentre scrivi
  try {
    const r = await fetch('api/state?since=' + rev, {cache: 'no-store'});
    if (r.status === 401) { location.reload(); return; }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (j.changed && !dirty && !inflight) applyRemote(j); else setSaved('Sincronizzato ✓');
  } catch (e) { setSaved('⚠ Server non raggiungibile'); }
}
async function botStatus() {
  try {
    const j = await (await fetch('api/health', {cache: 'no-store'})).json();
    botInfo = j; const w = $('#setWarn'); if (w) w.hidden = !isAdmin() || j.email !== false;
  } catch (e) {}
}
async function init() {
  if (REMOTE) {
    try {
      const info = await api('api/auth');
      if (!info.user) { renderAuth(info); return; }
      USER = info.user; FEATURES = info.features || {}; LEGAL_VERSION = info.legal || ''; if (info.source) SOURCE_URL = info.source;
      setTimeout(() => PWA.resync(), 1500);
      setTimeout(consentGate, 700);
      setTimeout(() => { if (!sheetEl && !/^#\/invito\//.test(location.hash)) { if (USER?.role === 'root' && !USER.settings?.flags?.setup) setupSheet(); else if (tourWanted()) tourSheet(); else handleGate(); } }, 1600);
      if (USER.settings?.look && JSON.stringify(USER.settings.look) !== JSON.stringify(LOOK.get())) LOOK.set(USER.settings.look, false);
      if (/^#\/reimposta\//.test(location.hash)) history.replaceState(null, '', '#/home');
      const r = await fetch('api/state', {cache: 'no-store'});
      if (!r.ok) throw new Error(r.status);
      const j = await r.json(); rev = j.rev;
      // primo accesso di un utente: parte con i dati di esempio (MAI con quelli salvati in questo browser)
      if (j.state) state = migrate(j.state); else { state = migrate(seed()); dirty = true; }
      if (!/^#\/invito\//.test(location.hash)) restoreLocation(); else state.view = 'calendar';
      if (isAdmin()) api('api/admin/users').then(x => { pendingCount = x.users.filter(u => u.status === 'pending').length; renderNav(); }).catch(() => {});
    } catch (e) {
      $('#main').innerHTML = '<div class="empty"><p>Impossibile contattare il server del tracker.</p><p>Controlla che sia avviato e ricarica la pagina.</p></div>';
      return;
    }
  }
  if (!REMOTE) restoreLocation();
  const invite = REMOTE && /^#\/invito\//.test(location.hash) ? location.hash : '';
  render();
  if (invite) checkInviteHash(invite);
  if (REMOTE) {
    if (dirty) writeNow(); else setSaved('Sincronizzato ✓');
    setInterval(poll, 4000);
    if (isAdmin()) { botStatus(); setInterval(botStatus, 60000); }
    window.addEventListener('focus', poll);
  } else writeNow();
}
init();
</script>
