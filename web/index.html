<script>
/* aspetto: automatico / chiaro / scuro / luce calda (+ luce calda la sera) e dimensione del testo */
window.lookResolve = function (p) {
  p = p || {};
  var t = p.theme || 'auto', min = function (s) { var a = String(s || '').split(':'); return (+a[0] || 0) * 60 + (+a[1] || 0); };
  var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches), warm = t === 'warm', night = false;
  if (p.night) { var n = new Date(), m = n.getHours() * 60 + n.getMinutes(), f = min(p.from || '21:00'), to = min(p.to || '07:00');
    night = f > to ? (m >= f || m < to) : (m >= f && m < to); }
  return {dark: dark, warm: warm || night, size: p.size || 'm'};
};
window.lookApply = function (p) {
  var r = document.documentElement, x = window.lookResolve(p);
  r.setAttribute('data-theme', x.dark ? 'dark' : 'light');
  if (x.warm) r.setAttribute('data-warm', '1'); else r.removeAttribute('data-warm');
  if (x.size !== 'm') r.setAttribute('data-size', x.size); else r.removeAttribute('data-size');
  var bg = x.dark ? (x.warm ? '#17130e' : '#000000') : (x.warm ? '#f3ead8' : '#fbfbfa');
  document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = bg; m.removeAttribute('media'); });
};
(function () {
  var p = {};
  try { p = JSON.parse(localStorage.getItem('tacuin-look') || '{}') || {}; } catch (e) {}
  if (!p.theme) { var old = null; try { old = localStorage.getItem('tracker-theme'); } catch (e) {} if (old === 'light' || old === 'dark') p.theme = old; }
  window.lookApply(p);
})();
</script>

function locationHash() {

  if (state.view === 'tracker' && cur()) return '#/tracker/' + cur().id;

  return '#/' + (VIEW_SLUG[state.view] || 'home');

function applyLocation(h) {
  const parts = String(h || '').replace(/^#\/?/, '').split('/');
  const slug = parts[0];
  if (slug === 'tracker' && state.trackers.some(t => t.id === parts[1])) { state.view = 'tracker'; state.active = parts[1]; return true; }
  const v = Object.keys(VIEW_SLUG).find(k => VIEW_SLUG[k] === slug);
  if (!v || ((v === 'users' || v === 'audit') && !isAdmin()) || ((v === 'profile' || v === 'chat' || v === 'trips') && !USER) || (v === 'receipt' && !FEATURES.vision)) return false;
  state.view = v;
  if (v === 'trips') ui.tripId = parts[1] || null;
  if (v === 'expenses') ui.expTab = parts[1] === 'condivise' ? 'shared' : 'personal';
  if (v === 'calendar') ui.calDate = /^\d{4}-\d{2}-\d{2}$/.test(parts[1] || '') ? parts[1] : today();
  if (v === 'journal') { ui.jDate = /^\d{4}-\d{2}-\d{2}$/.test(parts[1] || '') ? parts[1] : today(); ui.jList = false; }
  if (v === 'gym') ui.gymSession = parts[1] === 'allenamento' && !!(state.gym && state.gym.active);

  return true;
}

function shareOf(x, pid) {
  if (!x.split.includes(pid)) return 0;
  const w = x.weights;
  if (!w) return num(x.amount) / x.split.length;
  const tot = x.split.reduce((a, i) => a + (+w[i] || 0), 0);

/* Quote: "1/3", "40%", "2" (parti) oppure importi in €. Chi resta vuoto prende il resto, in parti uguali. */
function parseQuota(str, eur) {
  const t = String(str ?? '').trim().replace(/\s+/g, '').replace(',', '.');
  if (!t) return null;
  let m = t.match(/^(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if (m && !eur && +m[2]) return {k: 'frac', v: +m[1] / +m[2]};
  m = t.match(/^(\d+(?:\.\d+)?)%$/);
  if (m && !eur) return {k: 'frac', v: +m[1] / 100};
  m = t.match(/^(\d+(?:\.\d+)?)(€|eur|euro)?$/i);

  return {k: 'bad'};
}
function computeWeights(amount, ids, raw, mode) {
  if (mode === 'equal') return {weights: null};
  const q = {}; ids.forEach(i => q[i] = parseQuota(raw[i], mode === 'eur'));
  const given = ids.filter(i => q[i]), free = ids.filter(i => !q[i]);
  if (given.some(i => q[i].k === 'bad')) return {error: 'Quota non valida: usa 1/3, 40% o un numero.'};
  const kinds = new Set(given.map(i => q[i].k));
  if (kinds.size > 1) return {error: 'Usa lo stesso tipo di quota per tutti (frazioni/percentuali oppure parti).'};
  const kind = [...kinds][0], w = {};
  given.forEach(i => w[i] = q[i].v);
  if (!given.length) return {weights: null};
  if (kind === 'part') { free.forEach(i => w[i] = 1); return {weights: w}; }
  const total = kind === 'eur' ? amount : 1, used = given.reduce((a, i) => a + w[i], 0), rest = total - used;
  if (rest < -0.005 * (kind === 'eur' ? 1 : 0.01)) return {error: kind === 'eur' ? `Gli importi superano il totale di ${EUR(-rest)}.` : 'Le quote superano il 100%.'};
  if (free.length) free.forEach(i => w[i] = Math.max(0, rest) / free.length);
  else if (Math.abs(rest) > (kind === 'eur' ? 0.01 : 0.001)) return {error: kind === 'eur' ? `Mancano ${EUR(rest)} per arrivare al totale.` : `Le quote arrivano solo al ${Math.round(used * 100)}%.`};
  return {weights: w};
}

}

const kfmt = v => Math.abs(v) >= 1e6 ? fmt(Math.round(v / 1e5) / 10) + ' Mln' : Math.abs(v) >= 1e4 ? fmt(Math.round(v / 100) / 10) + 'k' : fmt(Math.round(v));

/* date dei versamenti di un piano (stessa regola del server: giorno del mese, se manca l'ultimo del mese) */
function pacSchedule(p, until, limit = 400) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(p.start || '')) return [];
  const s = kDate(p.start), every = [1, 2, 3, 6, 12].includes(+p.every) ? +p.every : 1, day = Math.max(1, Math.min(31, +p.day || s.getDate())), out = [];

const pacNext = (p, t = today()) => { const done = new Set(p.done || []); return pacSchedule(p, iso(addDays(kDate(t), 400))).find(d => d >= t && !done.has(d)); };
function invBuy(x, amount, price) {
  amount = num(amount); price = num(price); if (amount <= 0 || price <= 0) return 0;
  const q0 = num(x.qty), a0 = num(x.avg), q = amount / price;
  x.qty = Math.round((q0 + q) * 1e6) / 1e6; x.avg = Math.round((q0 * a0 + amount) / (q0 + q) * 1e6) / 1e6; return q;
}

  const q = invBuy(x, amount, price); if (!q) return 0;
  p.done = [...new Set([...(p.done || []), d])].sort().slice(-400);
  INV().log.push({d, item: x.id, plan: p.id, amount: num(amount), qty: Math.round(q * 1e6) / 1e6, price: num(price)}); return q;
}

function pacLocalRun() {

    pacDue(p).forEach(d => { if (pacRecord(p, x, d, p.amount, x.price)) any = true; }); });

async function invRefresh(force) {

/* punti del grafico: le foto giornaliere del valore e, prima della prima foto, una stima con le quantità di oggi */
function invSeries(rng) {
  const I = INV(), T = invTot(), t = today();
  const from = rng === 'max' ? '0000' : iso(addDays(new Date(), rng === '3mo' ? -92 : -366));
  const real = Object.entries(I.hist).filter(([d]) => d >= from && d <= t).sort((a, b) => a[0].localeCompare(b[0])).map(([d, v]) => ({d, inv: v[0], val: v[1]}));
  if (!real.length || real[real.length - 1].d !== t) real.push({d: t, inv: T.inv, val: T.val});
  const syms = [...new Set(I.items.filter(x => x.symbol && num(x.qty) > 0).map(x => x.symbol))];
  const H = invQ.hist[(rng === 'max' ? '5y' : rng) + ':' + syms.join(',')];
  const est = [];
  if (H && typeof H === 'object' && Object.keys(H).length) {
    const first = real[0].d, fixed = I.items.filter(x => !(x.symbol && H[x.symbol]?.length)).reduce((a, x) => a + num(x.qty) * num(x.price), 0);
    const days = [...new Set(Object.values(H).flat().map(p => p[0]))].filter(d => d >= from && d < first).sort();
    const idx = {}, lastC = {};
    days.forEach(d => {
      let v = fixed, ok = true;
      I.items.forEach(x => { const s = H[x.symbol]; if (!x.symbol || !s?.length) return;
        let i = idx[x.symbol] || 0; while (i < s.length && s[i][0] <= d) { lastC[x.symbol] = s[i][1]; i++; } idx[x.symbol] = i;
        if (lastC[x.symbol] == null) ok = false; else v += num(x.qty) * lastC[x.symbol]; });

}

function visibleRows(t) {
  let rows = t.rows;
  if (query) {
    const q = query.toLowerCase();
    rows = rows.filter(r => t.columns.some(c => String(r.cells[c.id] ?? '').toLowerCase().includes(q)));
  }
  const c = sort.col && t.columns.find(x => x.id === sort.col);
  if (c) rows = [...rows].sort((a, b) => {
    let va = a.cells[c.id], vb = b.cells[c.id];
    if (c.type === 'checkbox') return ((va ? 1 : 0) - (vb ? 1 : 0)) * sort.dir;
    const ea = isEmpty(va), eb = isEmpty(vb);
    if (ea || eb) return ea - eb;
    let r;
    if (c.type === 'number') r = parseFloat(va) - parseFloat(vb);
    else if (c.type === 'select') r = (c.options || []).indexOf(va) - (c.options || []).indexOf(vb);
    else r = String(va).localeCompare(String(vb), 'it', {numeric: true, sensitivity: 'base'});
    return r * sort.dir;
  });
  return rows;
}

function cellHtml(c, v, first) {
  const d = `data-c="${c.id}" aria-label="${esc(c.name)}"`, l = first ? 'class="w"' : `data-l="${esc(c.name)}"`;
  switch (c.type) {
    case 'number': return `<td ${l}><input class="cell" type="number" step="any" inputmode="decimal" ${d} value="${esc(v)}"></td>`;
    case 'date': return `<td ${l}><input class="cell" type="date" ${d} value="${esc(v)}"></td>`;
    case 'checkbox': return `<td class="cb ${first ? 'w' : ''}" ${first ? '' : `data-l="${esc(c.name)}"`}><input type="checkbox" ${d} ${v ? 'checked' : ''}></td>`;
    case 'select': {
      const opts = (c.options || []).map(o => `<option ${o === v ? 'selected' : ''} value="${esc(o)}">${esc(o)}</option>`).join('');
      return `<td ${l}><select ${d}><option value="">—</option>${opts}</select></td>`;
    }
    default: return `<td ${l}><input class="cell" ${d} value="${esc(v)}"></td>`;
  }
}
function paintSelect(el, col) {
  const i = (col.options || []).indexOf(el.value);
  el.classList.toggle('empty', i < 0);
  el.style.background = i < 0 ? 'transparent' : col.colors?.[el.value] ? `color-mix(in srgb, ${col.colors[el.value]} 22%, transparent)` : `hsl(${hue(i)} 65% 50% / .2)`;
}

function moveCol(i, d) { const cols = cur().columns; [cols[i], cols[i + d]] = [cols[i + d], cols[i]]; save(); renderMain(); }
function changeType(c, k, quiet) {
  if (c.type === k) return;

    let v = r.cells[c.id];
    if (k === 'checkbox') v = !isEmpty(v) && v !== false && v !== 'No' && v !== '0';

    else if (k === 'number') { const n = parseFloat(String(v ?? '').replace(',', '.')); v = isNaN(n) ? '' : String(n); }
    else if (k === 'date') v = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
    else v = isEmpty(v) ? '' : String(v);
    r.cells[c.id] = v;
  });
  if (k === 'select') {
    const vals = t.rows.map(r => r.cells[c.id]).filter(v => !isEmpty(v));

/* ---------- backup e utilità ---------- */
function download(text, name, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#exp').onclick = () => download(JSON.stringify(state, null, 2), `tracker-backup-${today()}.json`, 'application/json');
$('#imp').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.trackers)) throw 0;
      if (!await confirmSheet({title: 'Ripristinare il backup?', text: 'Tutti i dati attuali vengono sostituiti con quelli del file. Se vuoi tenerli, prima esporta un backup.', ok: 'Sostituisci i dati'})) return;
      state = migrate(d); state.active = cur()?.id ?? null;
      dirty = true; writeNow(); render();
    } catch (err) { toast('File non valido: serve un backup esportato da Tacuìn.'); }
  };
  rd.readAsText(f); e.target.value = '';
};

let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; }
function openMenu(anchor, items) {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu';
  items.forEach(it => {
    if (it.sep) { const s = document.createElement('div'); s.className = 'msep'; if (it.label) s.textContent = it.label; m.appendChild(s); return; }
    const b = document.createElement('button');
    if (it.danger) b.className = 'danger';
    b.innerHTML = it.icon ? `<span class="mi">${ico(it.icon, 18)}</span>${esc(it.label)}${it.checked ? '<span class="ck" style="margin-left:auto">✓</span>' : ''}` : `<span class="ck">${it.checked ? '✓' : ''}</span>${esc(it.label)}`;
    b.onclick = () => { closeMenu(); it.act(); };
    m.appendChild(b);
  });
  document.body.appendChild(m); menuEl = m;
  const r = anchor.getBoundingClientRect();
  let top = r.bottom + 4; if (top + m.offsetHeight > innerHeight - 8) top = Math.max(8, r.top - m.offsetHeight - 4);

(function swipe() { // swipe dal bordo sinistro per aprire, verso sinistra per chiudere
  let x0 = null, y0 = 0, dx = 0, mode = null;
  const side = $('#side'), w = () => side.offsetWidth;
  document.addEventListener('touchstart', e => {
    if (!isMobile() || e.touches.length !== 1) return;
    const t = e.touches[0], open = document.body.classList.contains('nav-open');
    if (!open && t.clientX < 24) mode = 'open';
    else if (open) mode = 'close';
    else return;
    x0 = t.clientX; y0 = t.clientY; dx = 0;
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    if (x0 == null) return;
    const t = e.touches[0]; dx = t.clientX - x0;
    if (Math.abs(t.clientY - y0) > Math.abs(dx) && Math.abs(dx) < 12) { x0 = null; document.body.classList.remove('dragging'); side.style.transform = ''; return; }
    document.body.classList.add('dragging');
    const off = mode === 'open' ? Math.min(0, -w() + Math.max(0, dx)) : Math.min(0, dx);
    side.style.transform = `translateX(${off}px)`;
  }, {passive: true});
  document.addEventListener('touchend', () => {
    if (x0 == null) return;
    document.body.classList.remove('dragging'); side.style.transform = '';
    if (mode === 'open' && dx > 60) openNav();
    if (mode === 'close' && dx < -60) closeNav();
    x0 = null; mode = null;
  });
})();

function handleCheck(inp, st) {
  let t = null, seq = 0;
  inp.addEventListener('input', () => {
    const v = inp.value.replace(/^@+/, '').toLowerCase().replace(/[^a-z0-9._]/g, '');
    if (v !== inp.value) inp.value = v;
    clearTimeout(t); st.textContent = ''; st.className = 'hdl-st';
    if (v.length < 3) return;
    const my = ++seq;
    t = setTimeout(async () => {
      try {
        const j = await api('api/handle/check?h=' + encodeURIComponent(v));
        if (my !== seq) return;
        st.textContent = j.ok ? 'libero' : (j.error ? 'non valido' : 'già preso'); st.className = 'hdl-st ' + (j.ok ? 'ok' : 'no');
        st.title = j.error || '';
      } catch (e) { if (my === seq) { st.textContent = ''; } }
    }, 350);
  });
}

  const chart = x.chart ? `<div class="mchart">${x.chart.map(c => `<div><span class="b" style="height:${Math.max(2, c.value / (Math.max(...x.chart.map(k => k.value)) || 1) * 56)}px" title="${esc(EUR(c.value))}"></span>${esc(c.label)}</div>`).join('')}</div>` : '';
  const btns = (x.buttons || []).length ? `<div class="qbtns">${x.buttons.flat().map(b => `<button data-act="${esc(b.data)}">${esc(b.text)}</button>`).join('')}</div>` : '';
  return `<div class="msg bot ${x.typing ? 'typing' : ''}" data-m="${x.id}"><div class="bot-av">${BOT_ICON}</div><div class="col"><div class="bub">${cleanHTML(x.html)}${chart}</div>${btns}</div></div>`;
}
function drawChat(scroll = true) {
  drawAssist(scroll);
  const log = $('#chatLog'); if (!log) return;
  log.innerHTML = loadChat().map(msgHTML).join('');
  if (scroll) log.scrollTop = log.scrollHeight;
}
async function syncSilently() { // aggiorna i dati dopo un comando senza ridisegnare la chat
  try { const j = await api('api/state'); if (j.state && !dirty) { const v = state.view, a = state.active; state = migrate(j.state); rev = j.rev; state.view = v; state.active = a; renderNav();
    if (v !== 'chat' && !document.querySelector('#main :focus')) renderMain(); } } catch (e) {}
}
async function sendChat(text) {
  text = String(text || '').trim();
  if (!text || chatBusy) return;
  if (dirty) await pushRemote();
  chatBusy = true;
  loadChat().push({id: uid(), who: 'me', text});
  const wait = {id: uid(), who: 'bot', html: '…', typing: true};
  chatLog.push(wait); drawChat();
  try {
    const j = await api('api/chat', {text});
    chatLog.splice(chatLog.indexOf(wait), 1, ...j.messages.map(m => ({id: uid(), who: 'bot', html: m.html, buttons: m.buttons, chart: m.chart})));
    syncSilently();
  } catch (e) {
    chatLog.splice(chatLog.indexOf(wait), 1, {id: uid(), who: 'bot', html: '⚠️ ' + esc(e.message)});
  }
  chatBusy = false; saveChat(); drawChat();
}
async function chatAction(msgId, data) {
  try {
    const r = await api('api/chat/action', {data});
    if (r.toast) toast(r.toast);
    const i = chatLog.findIndex(x => x.id === msgId);
    if (r.edit && i >= 0) chatLog[i] = {...chatLog[i], html: r.edit.html, buttons: r.edit.buttons, chart: null};
    if (r.new) chatLog.push({id: uid(), who: 'bot', html: r.new.html, buttons: r.new.buttons});
    saveChat(); drawChat(!r.edit || !!r.new); syncSilently();
  } catch (e) { toast(e.message); }
}

const TRIP_BASE = ["Documenti / carta d'identità", 'Caricabatterie', 'Medicine', 'Spazzolino e dentifricio', 'Cambi e biancheria', 'Occhiali da sole', 'Adattatore prese'];
const MESI3 = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const fmtD = s => { const d = new Date(s + 'T00:00'); return `${d.getDate()} ${MESI3[d.getMonth()]}`; };
const fmtRange = t => t.end && t.end !== t.start ? `${fmtD(t.start)} – ${fmtD(t.end)} ${t.end.slice(0, 4)}` : `${fmtD(t.start)} ${t.start.slice(0, 4)}`;
function tripWhen(t) {
  const now = today(), end = t.end || t.start;

    g.active = null; gymRest = null; ui.gymSession = false; save(); render(); return;
  }

    if (f.type === 'list') return `<div class="fs-f" data-f="${f.name}"><span>${esc(f.label)}</span><div class="fs-list" data-list="${f.name}" data-colors="${f.colors ? 1 : ''}">${(f.value || []).map(it => listRow(typeof it === 'string' ? {name: it} : it, f.colors, true)).join('')}
        <div class="fs-add"><input class="field" placeholder="${esc(f.placeholder || 'Nuova voce')}" aria-label="${esc(f.placeholder || 'Nuova voce')}" maxlength="60"><button type="button" class="primary" data-add aria-label="Aggiungi">${ico('plus', 18, 2.4)}</button></div></div>${h || (f.colors ? '<small>Trascina per cambiare l\'ordine, tocca il pallino per il colore.</small>' : '<small>Trascina per cambiare l\'ordine.</small>')}</div>`;
    const common = `id="${id}" name="${f.name}" class="field"${attr('placeholder', f.placeholder)}${attr('required', f.required)}${attr('maxlength', f.maxlength)}${attr('autocomplete', f.autocomplete)}${attr('inputmode', f.inputmode)}`;

      : `<input ${common} type="${f.type || 'text'}" value="${esc(f.value ?? '')}"${attr('min', f.min)}${attr('max', f.max)}${attr('step', f.step)}>`;

async function gmMaybeRefresh(force) {
  const at = state.garmin?.at || 0;
  if (ui._gmBusy || (!force && Date.now() / 1000 - at < 600)) return;
  ui._gmBusy = true;
  try { await api('api/garmin', {action: 'wellness'}); const s2 = await api('api/state'); applyRemote(s2); }
  catch (e) { /* Garmin non raggiungibile: restano i dati salvati */ }
  finally { setTimeout(() => { ui._gmBusy = false; }, 60000); }
}

/* foto del telefono (anche 12 MP) → JPEG di max 2000 px: più veloce da inviare e leggere */
function shrinkImage(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      if (k === 1 && file.size < 3e6) return res(file);
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), 'image/jpeg', 0.88);
    };
    img.onerror = () => res(file);
    img.src = rc.img;
  });
}

const otpClean = v => String(v || '').replace(/\s+/g, '');

  const sh = openSheet(`<div class="sh-h"><button class="more" data-x aria-label="Chiudi">${ico('x', 22)}</button><b style="flex:1;font-size:17px">Attiva la verifica in due passaggi</b></div>
    <form class="sh-b" id="tsPw" style="display:flex;flex-direction:column;gap:14px;padding-bottom:20px">
      <div style="font-size:14px">Per sicurezza conferma la tua password.</div>
      <input class="field" type="password" name="password" required autocomplete="current-password" placeholder="Password">
      <p class="auth-err" style="margin:0"></p>
      <button class="primary" style="min-height:46px">Continua</button></form>`, true);
  sh.querySelector('[data-x]').onclick = closeSheet;
  sh.querySelector('input').focus();
  sh.querySelector('#tsPw').addEventListener('submit', async e => {
    e.preventDefault(); const err = sh.querySelector('.auth-err'); err.textContent = '';
    let j; try { j = await api('api/me/totp', {action: 'start', password: e.target.password.value}); } catch (x) { err.textContent = x.message; return; }
    let qr = ''; try { await loadQR(); const q = qrcode(0, 'M'); q.addData(j.uri); q.make(); qr = q.createSvgTag({cellSize: 4, margin: 2, scalable: true}); } catch (x) {}
    const key = j.secret.replace(/(.{4})/g, '$1 ').trim();
    sh.innerHTML = `<div class="sh-h"><button class="more" data-x aria-label="Chiudi">${ico('x', 22)}</button><b style="flex:1;font-size:17px">Attiva la verifica in due passaggi</b></div>
      <form class="sh-b" id="tsCode" style="display:flex;flex-direction:column;gap:14px;padding-bottom:20px">
        <div style="font-size:14px"><b>1.</b> Apri l'app di autenticazione e inquadra il codice:</div>
        ${qr ? `<div class="totp-qr" role="img" aria-label="Codice QR da inquadrare con l'app">${qr}</div>` : ''}
        <div class="muted" style="font-size:12px;text-align:center">${qr ? 'Non riesci a inquadrarlo? ' : ''}Inserisci a mano la chiave<br><span class="totp-key">${esc(key)}</span> <button type="button" class="ghost" id="tsCopy" style="min-height:32px;padding:2px 10px;font-size:12px;margin-top:6px">Copia</button></div>
        <label style="font-size:14px" for="tsIn"><b>2.</b> Scrivi il codice di 6 cifre che vedi nell'app:</label>
        <input class="field otp-in" id="tsIn" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123 456" maxlength="7" required>
        <p class="auth-err" style="margin:0"></p>
        <button class="primary" style="min-height:46px">Attiva</button></form>`;
    sh.querySelector('[data-x]').onclick = closeSheet;
    sh.querySelector('#tsCopy').onclick = () => { navigator.clipboard?.writeText(j.secret).then(() => toast('Chiave copiata.'), () => {}); };
    sh.querySelector('#tsIn').focus();
    sh.querySelector('#tsCode').addEventListener('submit', async e2 => {
      e2.preventDefault(); const er = sh.querySelector('.auth-err'); er.textContent = '';
      try { const r = await api('api/me/totp', {action: 'confirm', code: otpClean(e2.target.code.value)}); USER = r.user; recoverySheet(r.recovery); }
      catch (x) { er.textContent = x.message; }
    });
  });
}
function recoverySheet(codes) {
  const txt = 'Codici di recupero Tacuìn (' + USER.email + ')\nOgnuno vale una volta sola.\n\n' + codes.join('\n') + '\n';
  const sh = openSheet(`<div class="sh-h"><b style="flex:1;font-size:17px;padding-left:10px">Fatto! Salva i codici di recupero</b></div>
    <div class="sh-b" style="display:flex;flex-direction:column;gap:14px;padding-bottom:20px">
      <div style="display:flex;gap:8px;align-items:center;color:var(--text)">${ico('check', 18, 2.4)}<b>Verifica in due passaggi attiva</b></div>
      <div style="font-size:14px">Se perdi il telefono entri con uno di questi codici (ognuno vale una volta sola). Conservali in un posto sicuro, per esempio nel tuo gestore di password: <b>non li vedrai più</b>.</div>
      <div class="rc-grid">${codes.map(c => `<span>${esc(c)}</span>`).join('')}</div>
      <div class="row-btns"><button class="ghost" id="rcDl">${ico('down', 16)}Scarica</button><button class="ghost" id="rcCp">Copia</button></div>
      <label style="display:flex;gap:10px;align-items:center;font-size:14px"><input type="checkbox" id="rcOk" style="width:20px;height:20px;accent-color:var(--accent)">Li ho salvati</label>
      <button class="primary" id="rcClose" style="min-height:46px" disabled>Chiudi</button></div>`, true);
  sh.querySelector('#rcDl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type: 'text/plain'})); a.download = 'codici-recupero-tacuin.txt'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  sh.querySelector('#rcCp').onclick = () => navigator.clipboard?.writeText(txt).then(() => toast('Codici copiati.'), () => {});
  sh.querySelector('#rcOk').onchange = e => { sh.querySelector('#rcClose').disabled = !e.target.checked; };
  sh.querySelector('#rcClose').onclick = () => { closeSheet(); render(); toast('Verifica in due passaggi attiva.'); };
}
function totpDisable() {
  const sh = openSheet(`<div class="sh-h"><button class="more" data-x aria-label="Chiudi">${ico('x', 22)}</button><b style="flex:1;font-size:17px">Disattiva la verifica in due passaggi</b></div>
    <form class="sh-b" style="display:flex;flex-direction:column;gap:14px;padding-bottom:20px">
      <div class="muted" style="font-size:14px">Dopo, per entrare basterà la password. Conferma con la password e un codice dell'app (o un codice di recupero).</div>
      <input class="field" type="password" name="password" required autocomplete="current-password" placeholder="Password">
      <input class="field otp-in" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123 456" required>
      <p class="auth-err" style="margin:0"></p>
      <button class="ghost dangerbtn" style="min-height:46px">Disattiva</button></form>`, true);
  sh.querySelector('[data-x]').onclick = closeSheet;
  sh.querySelector('form').addEventListener('submit', async e => {
    e.preventDefault(); const er = sh.querySelector('.auth-err'); er.textContent = '';
    try { const r = await api('api/me/totp', {action: 'disable', password: e.target.password.value, code: otpClean(e.target.code.value)}); USER = r.user; closeSheet(); render(); toast('Verifica in due passaggi disattivata.'); }
    catch (x) { er.textContent = x.message; }
  });
}
/* accesso: secondo passaggio, con email e password già controllate (restano solo in memoria) */
function renderTotpStep(info, a, creds) {
  let rec = false;

    const f = a.querySelector('form');
    f.innerHTML = `<div class="auth-2fa-h"><span>${ico('shield', 20)}</span><b style="font-size:18px">Verifica in due passaggi</b></div>

      <input class="field ${rec ? '' : 'otp-in'}" name="totp" ${rec ? 'autocomplete="off" placeholder="abcd-1234"' : 'inputmode="numeric" autocomplete="one-time-code" placeholder="123 456"'} required>

      <button class="primary" type="submit">Accedi</button>
      <div style="display:flex;justify-content:space-between;font-size:14px;gap:12px;flex-wrap:wrap"><button type="button" class="linkbtn" id="tRec" style="color:var(--accent);padding:6px 0">${rec ? 'Usa il codice dell\'app' : 'Usa un codice di recupero'}</button><button type="button" class="linkbtn muted" id="tBack" style="padding:6px 0">← Indietro</button></div>`;
    f.querySelector('input').focus();
    f.querySelector('#tRec').onclick = () => { rec = !rec; draw(); };
    f.querySelector('#tBack').onclick = () => renderAuth(info, 'login');
  };
  draw();
  const f = a.querySelector('form');

    e.preventDefault(); e.stopImmediatePropagation();
    const err = f.querySelector('.auth-err'), btn = f.querySelector('button[type=submit]'); err.textContent = ''; btn.disabled = true;
    try { await api('api/login', {...creds, totp: otpClean(f.totp.value)}); location.reload(); }
    catch (x) { err.textContent = x.message; btn.disabled = false; f.totp.select(); }
  }, true);
}

/* ---------- APP INSTALLABILE E NOTIFICHE (al posto di Telegram) ---------- */
const PWA = {
  ios: /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  android: /android/i.test(navigator.userAgent),
  standalone: () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
  canPush: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext,
  install: null,  // evento beforeinstallprompt (Chrome/Edge su Android e computer)
  device() {
    const u = navigator.userAgent;
    const os = /iphone/i.test(u) ? 'iPhone' : /ipad/i.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? 'iPad' : /android/i.test(u) ? 'Android' : /mac/i.test(u) ? 'Mac' : /win/i.test(u) ? 'Windows' : /linux/i.test(u) ? 'Linux' : 'Dispositivo';
    const br = /edg\//i.test(u) ? 'Edge' : /firefox|fxios/i.test(u) ? 'Firefox' : /chrome|crios/i.test(u) ? 'Chrome' : /safari/i.test(u) ? 'Safari' : '';
    return (this.standalone() ? `${os} (app)` : br ? `${os} · ${br}` : os);
  },
  async reg() { return navigator.serviceWorker.ready; },
  async sub() { try { return await (await this.reg()).pushManager.getSubscription(); } catch (e) { return null; } },
  async enable() {
    if (!this.canPush()) throw new Error(this.ios && !this.standalone() ? 'Su iPhone e iPad prima aggiungi Tacuìn alla schermata Home (vedi sotto), poi aprilo dall\'icona.' : 'Questo browser non supporta le notifiche.');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error(perm === 'denied' ? 'Le notifiche sono bloccate per Tacuìn: riattivale dalle impostazioni del browser o del telefono.' : 'Non hai dato il permesso alle notifiche.');
    const {key, ok} = await api('api/push/key');
    if (!ok || !key) throw new Error('Le notifiche non sono disponibili su questo server.');
    const r = await this.reg();
    let s = await r.pushManager.getSubscription();
    const want = b64ToBytes(key);
    if (s && s.options?.applicationServerKey && !sameBytes(new Uint8Array(s.options.applicationServerKey), want)) { await s.unsubscribe(); s = null; }
    if (!s) s = await r.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: want});
    await api('api/push/subscribe', {subscription: s.toJSON(), device: this.device()});
    return s;
  },
  async disable() {
    const s = await this.sub();
    if (s) { try { await api('api/push/unsubscribe', {endpoint: s.endpoint}); } catch (e) {} await s.unsubscribe().catch(() => {}); }
  },
  async resync() {  // all'apertura: se questo dispositivo è iscritto, il server lo sa (anche dopo un ripristino)
    if (!USER || !this.canPush() || Notification.permission !== 'granted') return;
    const s = await this.sub(); if (!s) return;
    try { await api('api/push/subscribe', {subscription: s.toJSON(), device: this.device()}); } catch (e) {}
  }
};
const b64ToBytes = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
const sameBytes = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.install = e; if (state.view === 'profile') drawPushPanel(); });
window.addEventListener('appinstalled', () => { PWA.install = null; toast('Tacuìn è installato: lo trovi tra le app.'); });
function installHelpHTML() {
  if (PWA.standalone()) return '';
  if (PWA.install) return `<div class="row-btns"><button class="ghost" id="pwaInstall">${ico('down', 16)}Installa Tacuìn come app</button></div>`;
  if (PWA.ios) return `<div class="inst"><b>Installa Tacuìn sull'${/ipad/i.test(navigator.userAgent) ? 'iPad' : 'iPhone'}</b><ol><li>In Safari tocca <b>Condividi</b> ${ico('upload', 15)} in basso</li><li>Scegli <b>«Aggiungi alla schermata Home»</b></li><li>Apri Tacuìn dalla nuova icona e attiva qui le notifiche</li></ol></div>`;
  if (PWA.android) return `<div class="inst"><b>Installa Tacuìn sul telefono</b><ol><li>In Chrome tocca il menu <b>⋮</b> in alto a destra</li><li>Scegli <b>«Installa app»</b> (o «Aggiungi a schermata Home»)</li></ol></div>`;
  return '';
}
async function drawPushPanel() {
  const box = $('#pfPush'); if (!box) return;
  const can = PWA.canPush(), perm = can ? Notification.permission : 'unsupported';
  const sub = can ? await PWA.sub() : null;
  let devs = []; try { devs = (await api('api/push/devices')).devices; } catch (e) {}
  const here = sub && devs.some(d => d.endpoint === sub.endpoint);
  const st = here ? ['on', 'Attive su questo dispositivo'] : perm === 'denied' ? ['off', 'Bloccate in questo browser'] : !can ? ['off', PWA.ios && !PWA.standalone() ? 'Prima installa Tacuìn (vedi sotto)' : 'Non supportate da questo browser'] : ['', 'Non attive su questo dispositivo'];
  box.innerHTML = `<h2>Notifiche</h2>
    <div class="muted" style="font-size:14px">Promemoria, appuntamenti e inviti arrivano come notifica sul telefono o sul computer, anche con Tacuìn chiuso.</div>
    <div class="totp-st ${st[0] === 'on' ? 'on' : ''}"><i></i><b style="font-weight:600">${st[1]}</b></div>
    <div class="row-btns">${here ? `<button class="ghost" id="pushTest">Manda una notifica di prova</button><button class="ghost dangerbtn" id="pushOff">Disattiva qui</button>` : can && perm !== 'denied' ? `<button class="primary" id="pushOn">${ico('bell', 16)}Attiva le notifiche</button>` : ''}</div>
    ${perm === 'denied' ? '<p class="hint" style="margin:0">Per riattivarle: impostazioni del browser (o del telefono) → Notifiche → consenti per Tacuìn.</p>' : ''}
    ${installHelpHTML()}
    ${devs.length ? `<div class="dev-list"><div class="glab" style="padding:4px 0 2px">Dispositivi che ricevono le notifiche</div>${devs.map(d => `<div class="dev"><span>${ico(/iphone|android|ipad/i.test(d.device) ? 'phone' : 'laptop', 16)}${esc(d.device)}${sub && d.endpoint === sub.endpoint ? ' <small class="muted">· questo</small>' : ''}</span><button class="mini" data-dev="${esc(d.endpoint)}" aria-label="Togli ${esc(d.device)}">${ico('x', 16)}</button></div>`).join('')}</div>` : ''}`;
  $('#pushOn')?.addEventListener('click', async e => { e.target.disabled = true; try { await PWA.enable(); toast('Notifiche attive su questo dispositivo.'); } catch (x) { toast(x.message); } drawPushPanel(); loadReminders(); });
  $('#pushOff')?.addEventListener('click', async () => { await PWA.disable(); toast('Notifiche disattivate su questo dispositivo.'); drawPushPanel(); loadReminders(); });
  $('#pushTest')?.addEventListener('click', async e => { e.target.disabled = true; try { toast((await api('api/me/reminders/test', {channel: 'push', kind: 'morning'})).message); } catch (x) { toast(x.message); } e.target.disabled = false; });
  $('#pwaInstall')?.addEventListener('click', async () => { const ev = PWA.install; if (!ev) return; ev.prompt(); await ev.userChoice.catch(() => {}); PWA.install = null; drawPushPanel(); });
  box.querySelectorAll('[data-dev]').forEach(b => b.onclick = async () => { await api('api/push/unsubscribe', {endpoint: b.dataset.dev}); if (sub && b.dataset.dev === sub.endpoint) await sub.unsubscribe().catch(() => {}); drawPushPanel(); loadReminders(); });
}

/* ---------- PROMEMORIA (Profilo) ---------- */
const WEEKDAYS = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
async function loadReminders() {
  const box = $('#pfRem'); if (!box) return;
  let j; try { j = await api('api/me/reminders'); } catch (e) { box.querySelector('.hint').textContent = e.message; return; }
  const ch = j.channels;
  const note = [!ch.email ? 'L\'invio email non è ancora configurato sul server: chiedi all\'amministratore (SMTP nel file .env).' : '',
                !ch.push ? 'Le notifiche non sono disponibili su questo server.' : (!ch.push_devices ? 'Per ricevere le notifiche attivale su questo dispositivo (riquadro «Notifiche» qui sopra). Finché non lo fai, arriva solo l\'email.' : '')].filter(Boolean);
  box.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2>Promemoria e avvisi</h2>
      <div class="row-btns"><button class="ghost" data-test="email" ${ch.email ? '' : 'disabled'}>Prova via email</button><button class="ghost" data-test="push" ${ch.push_devices ? '' : 'disabled'}>Prova come notifica</button></div></div>
    <div class="boxed"><table class="utable rem cardt"><thead><tr><th><span class="sr-only">Promemoria</span></th><th>Quando</th><th style="text-align:center">Notifica</th><th style="text-align:center">Email</th></tr></thead><tbody>
    ${Object.entries(j.meta).map(([k, m]) => { const r = j.reminders[k]; return `<tr data-k="${k}">
      <td><b style="font-weight:500">${esc(m.label)}</b><small>${esc(m.hint)}</small></td>
      <td data-l="Quando"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${m.weekly ? `<select class="field" data-f="day" aria-label="Giorno" style="padding:4px 6px">${WEEKDAYS.map((d, i) => `<option value="${i}" ${r.day === i ? 'selected' : ''}>${d}</option>`).join('')}</select>` : ''}
        <input class="field" type="time" data-f="time" value="${esc(r.time)}" style="padding:4px 6px;width:118px" aria-label="Ora"></div></td>
      <td style="text-align:center" data-l="Notifica"><input type="checkbox" data-f="push" aria-label="Notifica" ${r.push ? 'checked' : ''} ${ch.push ? '' : 'disabled'}></td>
      <td style="text-align:center" data-l="Email"><input type="checkbox" data-f="email" aria-label="Email" ${r.email ? 'checked' : ''} ${ch.email ? '' : 'disabled'}></td>
    </tr>`; }).join('')}</tbody></table></div>
    ${note.map(n => `<p class="hint" style="margin:0">${esc(n)}</p>`).join('')}
    <p class="hint" style="margin:0">I promemoria arrivano solo se c'è qualcosa da dire (es. abitudini non ancora fatte). Gli avvisi degli appuntamenti arrivano come notifica, oppure via email se non hai attivato le notifiche. Le modifiche si salvano da sole.</p>`;
  const collect = () => { const o = {}; box.querySelectorAll('tr[data-k]').forEach(tr => {
    const g = f => tr.querySelector(`[data-f=${f}]`);
    o[tr.dataset.k] = {time: g('time').value, day: g('day') ? +g('day').value : null, email: g('email').checked, push: g('push').checked};
  }); return o; };
  box.querySelector('tbody').addEventListener('change', async () => {
    try { await api('api/me/reminders', {reminders: collect()}); toast('Promemoria salvati.'); } catch (e) { toast(e.message); }
  });
  box.querySelectorAll('[data-test]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await api('api/me/reminders/test', {channel: b.dataset.test, kind: 'morning'}); toast(r.message); }
    catch (e) { toast(e.message); } finally { b.disabled = false; }
  });
}

/* ---------- UTENTI (admin) ---------- */
const STATUS_LABEL = {active: '● Attivo', pending: '◐ In attesa', disabled: '○ Disattivato', rejected: '○ Rifiutato'};
const fmtWhen = s => { if (!s) return '—'; const d = new Date(s); const diff = (Date.now() - d) / 6e4;
  return diff < 2 ? 'adesso' : diff < 60 ? `${Math.round(diff)} min fa` : d.toLocaleString('it-IT', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}); };
async function renderUsers() {
  const m = $('#main');
  m.innerHTML = `<div class="head">${hIcon('shield')}<h1 class="title">Utenti</h1></div><p class="hint">Caricamento…</p>`;
  let j; try { j = await api('api/admin/users'); } catch (x) { m.querySelector('.hint').textContent = x.message; return; }
  const pend = j.users.filter(u => u.status === 'pending'), others = j.users.filter(u => u.status !== 'pending');
  pendingCount = pend.length; renderNav();
  const roleOpts = USER.role === 'root' ? '<option value="user">Utente</option><option value="admin">Admin</option>' : '<option value="user">Utente</option>';
  m.innerHTML = `
    <div class="head">${hIcon('shield')}<h1 class="title">Utenti</h1></div>
    <div class="cards">
      <div class="card"><div class="lbl">Attivi</div><div class="val">${j.stats.active}</div></div>
      <div class="card"><div class="lbl">In attesa</div><div class="val" style="color:#c58a1a">${j.stats.pending}</div></div>
      <div class="card"><div class="lbl">Disattivati</div><div class="val">${j.stats.disabled + j.stats.rejected}</div></div>
      <div class="card"><div class="lbl">Accessi falliti (24 h)</div><div class="val">${j.stats.fails24}</div></div>
    </div>
    ${Object.keys(j.sources || {}).length ? `<p class="hint" style="margin:-4px 0 14px">Come ci hanno conosciuto: ${Object.entries(j.sources).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<b>${esc(k)}</b> ${v}`).join(' · ')}</p>` : ''}
    ${pend.length ? `<h2 class="sub">Richieste da approvare</h2><div style="display:flex;flex-direction:column;gap:8px">${pend.map(u => `
      <div class="req" data-u="${u.id}">
        <span class="av" style="background:hsl(${hue(u.name.length)} 50% 48%)">${esc(u.name.slice(0, 1).toUpperCase())}</span>
        <span class="who"><b>${esc(u.name)}</b><small>${esc(u.email)} · richiesto ${esc(fmtWhen(u.created))}${u.source ? ' · da ' + esc(u.source) : ''}</small></span>
        <label class="req-role">Ruolo <select class="field" data-role>${roleOpts}</select></label>
        <button class="ghost" data-act="reject">Rifiuta</button>
        <button class="primary" data-act="approve">Approva</button>
      </div>`).join('')}</div>` : ''}
    <h2 class="sub">Tutti gli utenti</h2>
    <div class="boxed"><table class="utable cardt">
      <thead><tr><th>Utente</th><th>Ruolo</th><th>Stato</th><th>Ultimo accesso</th><th><span class="sr-only">Azioni</span></th></tr></thead>
      <tbody>${others.map(u => `<tr data-u="${u.id}">
        <td class="w"><span><b style="font-weight:500">${esc(u.name)}</b>${u.id === USER.id ? ' <span class="muted">(tu)</span>' : ''}</span><small>${esc(u.email)}${u.source ? ' · da ' + esc(u.source) : ''}</small></td>
        <td data-l="Ruolo"><span class="rolebadge ${u.role}" style="align-self:flex-start">${esc(u.role_label)}</span></td>
        <td class="st-${u.status}" data-l="Stato">${STATUS_LABEL[u.status] || u.status}</td>
        <td data-l="Ultimo accesso">${esc(fmtWhen(u.last_login))}</td>
        <td class="del">${u.role === 'root' || u.id === USER.id || (u.role === 'admin' && USER.role !== 'root') ? '' : `<button class="mini more" data-menu aria-label="Azioni per ${esc(u.name)}">${ico('more', 18)}</button>`}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <p class="hint">Root e admin gestiscono gli account ma non possono vedere i dati personali (spese, abitudini…) degli altri utenti.</p>
    <p class="hint">${j.email.configured ? 'Email attive: le persone ricevono un avviso quando le approvi e i link per la password.' + (j.email.error ? ' Attenzione, ultimo invio non riuscito: ' + esc(j.email.error) : '')
      : 'Email non configurate: per avvisare automaticamente gli utenti imposta SMTP nel file .env (vedi README).'}</p>`;
  const act = async (id, action, value) => {
    try {
      const r = await api('api/admin/user', {id, action, value});
      if (r.link) showLink(r.message, r.link); else toast(r.message);
      renderUsers();
    } catch (x) { toast(x.message); }
  };
  m.querySelectorAll('.req').forEach(el => el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    act(el.dataset.u, b.dataset.act, el.querySelector('[data-role]').value);
  }));
  m.querySelector('tbody').addEventListener('click', e => {
    const b = e.target.closest('[data-menu]'); if (!b) return;
    const u = j.users.find(x => x.id === b.closest('tr').dataset.u);
    openMenu(b, [
      ...(USER.role === 'root' ? [{label: u.role === 'admin' ? 'Rendi Utente' : 'Rendi Admin', act: () => act(u.id, 'role', u.role === 'admin' ? 'user' : 'admin')}] : []),
      u.status === 'active' ? {label: 'Disattiva', act: async () => await confirmSheet({title: `Disattivare ${u.name}?`, text: 'Non potrà più accedere finché non lo riattivi. I suoi dati restano.', ok: 'Disattiva'}) && act(u.id, 'disable')}
                            : {label: 'Riattiva', act: () => act(u.id, 'enable')},
      {label: 'Link per nuova password', act: () => act(u.id, 'reset_link')},
      ...(u.totp ? [{label: 'Azzera la verifica in due passaggi', act: async () => await confirmSheet({title: 'Azzerare la verifica in due passaggi?', text: `${esc(u.name)} potrà entrare con la sola password e tutte le sue sessioni verranno chiuse.`, ok: 'Azzera'}) && act(u.id, 'totp_reset')}] : []),
      u.invites_off ? {label: 'Riattiva gli inviti agli appuntamenti', act: () => act(u.id, 'invites_on')}
                    : {label: 'Disattiva gli inviti agli appuntamenti', act: () => act(u.id, 'invites_off')},
      {label: 'Chiudi tutte le sessioni', act: () => act(u.id, 'logout_all')},
      {sep: true},
      {label: 'Elimina account e dati', danger: true, act: async () => await confirmSheet({title: `Eliminare ${u.name}?`, text: 'Elimina per sempre l\'account e tutti i suoi dati. Non si può annullare.', ok: 'Elimina per sempre', input: {label: 'Per confermare scrivi ELIMINA', match: 'ELIMINA'}}) === 'ELIMINA' && act(u.id, 'delete')}
    ]);
  });
}
function showLink(msg, link) {
  closeMenu();
  const box = document.createElement('div');
  box.className = 'menu'; box.style.cssText = 'left:50%;top:30%;transform:translateX(-50%);width:min(460px,calc(100vw - 32px));padding:16px;gap:10px;white-space:normal';
  box.innerHTML = `<b>${esc(msg)}</b><div class="muted" style="font-size:13px">Invia questo link alla persona: aprendolo potrà scegliere una nuova password.</div>
    <div class="linkbox"><span style="flex:1">${esc(link)}</span></div><div class="row-btns"><button class="primary" data-c>Copia link</button><button class="ghost" data-x>Chiudi</button></div>`;
  document.body.appendChild(box); menuEl = box;
  box.querySelector('[data-c]').onclick = () => { navigator.clipboard?.writeText(link); toast('Link copiato.'); };
  box.querySelector('[data-x]').onclick = closeMenu;
}

/* ---------- REGISTRO ATTIVITÀ (admin) ---------- */
const AUDIT_LABEL = {'login': 'Accesso', 'login.fail': 'Accesso fallito', 'user.register': 'Richiesta di accesso', 'user.create': 'Account creato',
  'admin.approve': 'Approvato', 'admin.reject': 'Rifiutato', 'admin.disable': 'Disattivato', 'admin.enable': 'Riattivato', 'admin.role': 'Ruolo cambiato',
  'admin.logout_all': 'Sessioni chiuse', 'admin.invites_off': 'Inviti disattivati', 'admin.totp_reset': 'Verifica in due passaggi azzerata', 'user.totp_recovery': 'Codice di recupero usato', 'admin.invites_on': 'Inviti riattivati', 'user.totp_on': 'Verifica in due passaggi attivata', 'user.totp_off': 'Verifica in due passaggi disattivata', 'login.totp_fail': 'Codice di verifica sbagliato', 'admin.reset_link': 'Link nuova password', 'admin.delete': 'Account eliminato', 'user.password': 'Password cambiata',
  'user.email': 'Email cambiata', 'sessions.revoke': 'Uscita da tutti i dispositivi', 'telegram.link': 'Telegram collegato', 'telegram.unlink': 'Telegram scollegato', 'push.subscribe': 'Notifiche attivate su un dispositivo',
  'user.self_delete': "Account eliminato dall'utente", 'security.ban': 'Indirizzo bloccato (scudo)', 'admin.server.quotes': 'Prezzi automatici', 'admin.server.food': 'Ricerca prodotti'};
async function renderAudit() {
  const m = $('#main');
  m.innerHTML = `<div class="head">${hIcon('list')}<h1 class="title">Registro attività</h1></div><p class="hint">Caricamento…</p>`;
  let j; try { j = await api('api/admin/audit'); } catch (x) { m.querySelector('.hint').textContent = x.message; return; }
  m.innerHTML = `<div class="head">${hIcon('list')}<h1 class="title">Registro attività</h1></div>
    <div class="boxed"><table class="utable cardt"><thead><tr><th>Quando</th><th>Chi</th><th>Cosa</th><th>Su chi</th><th>Dettagli</th><th>IP</th></tr></thead>
    <tbody>${j.items.map(i => `<tr><td data-l="Quando">${esc(fmtWhen(i.ts))}</td><td data-l="Chi">${esc(i.actor_name || (i.actor_id === 'system' ? 'Sistema' : '—'))}</td>
      <td class="w ${i.action === 'login.fail' ? 'neg' : ''}" style="order:-1"><b style="font-weight:500">${esc(AUDIT_LABEL[i.action] || i.action)}</b></td><td data-l="Su chi">${esc(i.target_name || '—')}</td>
      <td class="muted w2 ${i.detail ? '' : 'emp'}">${esc(i.detail || '')}</td><td class="muted" data-l="IP">${esc(i.ip || '')}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Nessuna attività.</td></tr>'}</tbody></table></div>
    <p class="hint">Ultime 300 operazioni su accessi e account. Le voci più vecchie di 12 mesi vengono cancellate da sole.</p>`;
}
$('#meChip').onclick = () => { state.view = 'profile'; closeNav(); render(); };
$('#syncErr').addEventListener('click', e => { if (e.target.closest('#syncRetry')) { setSaved('Sincronizzazione…'); writeNow(); } });
$('#nav').addEventListener('scroll', navCue, {passive: true}); $('#side').addEventListener('scroll', navCue, {passive: true}); addEventListener('resize', navCue);
if (window.ResizeObserver) new ResizeObserver(() => navCue()).observe($('#nav'));
$('#trashBtn').onclick = () => { state.view = 'trash'; closeNav(); render(); };
$('#menuEdit').onclick = () => { closeNav(); menuSheet(); };

/* ---------- avvio e sincronizzazione ---------- */
async function poll() {
  if (!REMOTE || dirty || inflight || document.hidden || menuEl || sheetEl || !fabMenu.hidden) return;
  const ae = document.activeElement;
  if (ae && ae.matches && ae.matches('input,select,textarea')) return; // non disturbare mentre scrivi
  try {
    const r = await fetch('api/state?since=' + rev, {cache: 'no-store'});
    if (r.status === 401) { location.reload(); return; }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (j.changed && !dirty && !inflight) applyRemote(j); else setSaved('Sincronizzato ✓');
  } catch (e) { setSaved('⚠ Server non raggiungibile'); }
}
async function botStatus() {
  try {
    const j = await (await fetch('api/health', {cache: 'no-store'})).json();
    botInfo = j; const w = $('#setWarn'); if (w) w.hidden = !isAdmin() || j.email !== false; renderNav();
  } catch (e) {}
}
async function init() {
  if (REMOTE) {
    try {
      const info = await api('api/auth');
      if (!info.user) { renderAuth(info); return; }
      USER = info.user; FEATURES = info.features || {}; LEGAL_VERSION = info.legal || ''; if (info.source) SOURCE_URL = info.source;
      setTimeout(() => PWA.resync(), 1500);
      setTimeout(consentGate, 700);
      setTimeout(() => { if (!sheetEl && !/^#\/invito\//.test(location.hash)) { if (USER?.role === 'root' && !USER.settings?.flags?.setup) setupSheet(); else if (tourWanted()) tourSheet(); else handleGate(); } }, 1600);
      if (USER.settings?.look && JSON.stringify(USER.settings.look) !== JSON.stringify(LOOK.get())) LOOK.set(USER.settings.look, false);
      if (/^#\/reimposta\//.test(location.hash)) history.replaceState(null, '', '#/home');
      const r = await fetch('api/state', {cache: 'no-store'});
      if (!r.ok) throw new Error(r.status);
      const j = await r.json(); rev = j.rev;
      // primo accesso di un utente: parte con i dati di esempio (MAI con quelli salvati in questo browser)
      if (j.state) state = migrate(j.state); else { state = migrate(seed()); dirty = true; }
      if (!/^#\/invito\//.test(location.hash)) restoreLocation(); else state.view = 'calendar';
      if (isAdmin()) api('api/admin/users').then(x => { pendingCount = x.users.filter(u => u.status === 'pending').length; renderNav(); }).catch(() => {});
    } catch (e) {
      $('#main').innerHTML = '<div class="empty"><p>Impossibile contattare il server del tracker.</p><p>Controlla che sia avviato e ricarica la pagina.</p></div>';
      return;
    }
  }
  if (!REMOTE) restoreLocation();
  const invite = REMOTE && /^#\/invito\//.test(location.hash) ? location.hash : '';
  render();
  if (invite) checkInviteHash(invite);
  if (REMOTE) {
    if (dirty) writeNow(); else setSaved('Sincronizzato ✓');
    setInterval(poll, 4000);
    if (isAdmin()) { botStatus(); setInterval(botStatus, 60000); }
    window.addEventListener('focus', poll);
  } else writeNow();
}
init();
</script>
