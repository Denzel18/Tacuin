# Ad ogni push su main: controlla il codice e pubblica l'immagine Docker su GitHub Container Registry
# (ghcr.io/<utente>/<repository>), pronta da usare su qualsiasi server con Docker.
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controllo sintassi Python
        run: python3 -m py_compile *.py vision/app.py

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: meta_vision
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-vision
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Immagine del servizio vision (scontrini)
        uses: docker/build-push-action@v6
        with:
          context: ./vision
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_vision.outputs.tags }}
          labels: ${{ steps.meta_vision.outputs.labels }}
          cache-from: type=gha,scope=vision
          cache-to: type=gha,mode=max,scope=vision
